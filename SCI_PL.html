  <div id="ledgerBody"></div>`;
  const lq=document.getElementById('lq');
  const apply=()=>{ledgerParty=lq.value.trim();drawLedger();};
  lq.addEventListener('input',()=>{clearTimeout(window._ld);window._ld=setTimeout(apply,200)});
  lq.addEventListener('change',apply);
  attachDropdown('lq', partyNames);
  document.getElementById('ledStart').onchange=e=>{ledgerStart=e.target.value;drawLedger();};

  document.getElementById('ledRangeReset').onclick=()=>{ledgerStart='';ledgerEnd='';renderLedger();};

}
function drawLedger(){
  const body=document.getElementById('ledgerBody');
  if(!ledgerParty){body.innerHTML=`<div class="empty" style="padding:40px 16px;text-align:center;color:var(--ink-faint)"><p>위 검색창에 거래처명을 입력하세요.</p></div>`;return;}
  // 이 거래처 전체 거래 (시간순)
  const allChrono=T.filter(t=>t.p===ledgerParty).sort((a,b)=>(a.d||'').localeCompare(b.d||''));
  if(!allChrono.length){body.innerHTML=`<div class="empty" style="padding:40px 16px;text-align:center;color:var(--ink-faint)"><p>“${esc(ledgerParty)}” 거래처의 거래내역이 없습니다.</p></div>`;return;}
  const cust=C.find(c=>c.nm===ledgerParty)||{};
  const startSet = !!ledgerStart, endSet = !!ledgerEnd;
  // 잔액 누적 함수
  const applyBal=(t,bal)=>{
    let debit=0,credit=0,cash=false;
    if(t.g==='수입'){ if(t.pm){cash=true} else{debit=t.t;bal+=t.t} }
    else if(t.g==='수금'){credit=t.t;bal-=t.t}
    else if(t.g==='비용'){if(!t.pm){credit=t.t;bal-=t.t}}
    else if(t.g==='지급'){debit=t.t;bal+=t.t}
    return {debit,credit,cash,bal};
  };
  // 기초 잔액 = 마스터 ar/ap + 기간 시작 전 거래 누적
  let openBal=(cust.ar||0)-(cust.ap||0);
  allChrono.forEach(t=>{
    if(startSet && (t.d||'') < ledgerStart){ openBal = applyBal(t, openBal).bal; }
  });
  // 기간 내 거래만
  const inPeriod = allChrono.filter(t=>{
    if(startSet && (t.d||'') < ledgerStart) return false;
    if(endSet && (t.d||'') > ledgerEnd) return false;
    return true;
  });
  if(!inPeriod.length){
    body.innerHTML=`<div class="empty" style="padding:40px 16px;text-align:center;color:var(--ink-faint)"><p>“${esc(ledgerParty)}” 거래처의 ${esc(ledgerStart||'처음')} ~ ${esc(ledgerEnd||'끝')} 기간 거래가 없습니다.</p></div>`;
    return;
  }
  // 기간 내 거래 잔액 누적 (기초잔액에서 시작)
  let bal=openBal;
  const startBal=openBal;
  const chronoLines=inPeriod.map(t=>{
    const r=applyBal(t,bal); bal=r.bal;
    return {t,debit:r.debit,credit:r.credit,bal:r.bal,cash:r.cash};
  });
  const lines=[...chronoLines].reverse(); // 화면 표시: 최근 → 과거
  const tt=totals(inPeriod);
  const hasSale=tt.incTot>0, hasBuy=tt.expTot>0;
  const balLabel = bal>0 ? '미수금' : bal<0 ? '미지급금' : '정산완료';
  const balColor = bal>0 ? 'var(--expense)' : bal<0 ? 'var(--income)' : 'var(--ink-faint)';
  const periodLabel = (startSet||endSet) ? `${ledgerStart||'처음'} ~ ${ledgerEnd||'끝'}` : '전체 기간';
  body.innerHTML=`
  <div class="ledger-head">
    <div class="card lcard"><div class="k">거래처</div><div class="v" style="font-size:18px">${esc(ledgerParty)}</div>
      <div class="hint" style="margin-top:4px;font-size:12px;color:var(--ink-faint)">${esc(cust.biz||'')} ${cust.ceo?'· '+esc(cust.ceo):''}</div></div>
    ${hasSale?`<div class="card lcard"><div class="k">총 매출</div><div class="v pos num">${won(tt.incTot)}</div>
      <div class="hint" style="margin-top:2px;font-size:11px;color:var(--ink-faint)">수금 ${won(tt.colTot)}</div></div>`:''}
    ${hasBuy?`<div class="card lcard"><div class="k">총 매입</div><div class="v num" style="color:var(--expense)">${won(tt.expTot)}</div>
      <div class="hint" style="margin-top:2px;font-size:11px;color:var(--ink-faint)">지급 ${won(tt.payTot)}</div></div>`:''}
    <div class="card lcard"><div class="k">${(startSet||endSet)?'기말':'현재'} ${balLabel}</div><div class="v num" style="color:${balColor}">${won(Math.abs(bal))}</div>
      <div class="hint" style="margin-top:2px;font-size:11px;color:var(--ink-faint)">${periodLabel}</div></div>
  </div>
  <div class="card tbl-responsive">
    <div class="tbl-wrap"><table class="tbl compact"><thead><tr><th>일자</th><th>구분</th><th>적요/품명</th><th class="r">증가</th><th class="r">감소</th><th class="r">잔액(당시)</th></tr></thead><tbody>
    ${lines.map(l=>`<tr><td class="muted">${l.t.d}</td><td><span class="chip ${l.t.g}">${l.t.g}</span></td>
      <td>${esc(l.t.inm||l.t.m)||'-'}${l.cash?` <span class="muted" style="font-size:11px">· 즉시결제 ${won(l.t.t)}</span>`:''}</td>
      <td class="r num">${l.debit?won(l.debit):''}</td><td class="r num">${l.credit?won(l.credit):''}</td>
      <td class="r num"><b>${won(l.bal)}</b></td></tr>`).join('')}
    ${startBal!==0?`<tr><td colspan="5" class="muted">${(startSet)?'기초이월 (기간 시작 전 잔액)':'전기이월'}</td><td class="r num"><b>${won(startBal)}</b></td></tr>`:''}
    </tbody></table></div>
    <div class="tcards">${lines.map(l=>`<div class="tcard"><div class="top"><div class="l"><div class="party">${esc(l.t.inm||l.t.m)||esc(l.t.a)}</div><div class="date">${l.t.d}${l.cash?' · 즉시결제':''}</div></div>
      <div class="amt ${l.debit?'neg':l.credit?'pos':'muted'}">${l.debit?'+'+won(l.debit):l.credit?'-'+won(l.credit):won(l.t.t)}</div></div>
      <div class="meta"><div class="m"><span class="chip ${l.t.g}">${l.t.g}</span></div><div class="m"><span>잔액</span><b>${won(l.bal)}</b></div></div></div>`).join('')}</div>
  </div>`;
}

    const n=UCUST.length;

    UCUST=[]; saveCust(); rebuildMasters(); renderMaster();

    if(n===0){alert('직접 등록한 품목이 없습니다. (기본 품목은 초기화 대상이 아닙니다)');return;}

    UITEM=[]; saveItem(); rebuildMasters(); renderMaster();
  }
}

async function handleBulkFile(e,tab){
  const f=e.target.files[0]; if(!f)return;
  document.getElementById('mBulkFileName').textContent=f.name;
  const ext=(f.name.match(/\.(\w+)$/)||['','txt'])[1].toLowerCase();
  if(ext==='json'){
    const txt=await f.text();
    try{
      const data=JSON.parse(txt);
      if(!Array.isArray(data)){alert('JSON 최상위가 배열이어야 합니다.');return;}
      // JSON은 객체 배열이라고 가정 → 그대로 미리보기에서 사용하려면 textarea로 표시
      document.getElementById('mBulkText').value=data.map(o=>{
        return tab==='cust'
          ? [o.nm||o.상호||'',o.biz||o.사업자번호||'',o.ceo||o.대표자||'',o.tel||o.전화번호||'',o.mtel||o.휴대전화||'',o.email||o.이메일||'',o.addr||o.주소||'',o.cat||o.업태||'',o.item||o.종목||'',o.mgr||o.담당자||'',o.memo||o.메모||'',o.ar||o.기초미수금||0,o.ap||o.기초미지급금||0].join('\t')
          : [o.code||o.코드||'',o.nm||o.품명||'',o.grp||o.그룹||'',o.spec||o.규격||'',o.unit||o.단위||'',o.buy||o.매입단가||0,o.sell||o.매출단가||0].join('\t');
      }).join('\n');
    }catch(err){alert('JSON 파싱 실패: '+err.message);return;}
  } else if(ext==='csv'||ext==='txt'){
    const txt=await f.text();
    document.getElementById('mBulkText').value=txt;
  } else if(ext==='xlsx'||ext==='xls'){
    await loadSheetJS();
    const buf=await f.arrayBuffer();
    const wb=XLSXlib.read(buf,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const aoa=XLSXlib.utils.sheet_to_json(ws,{header:1,raw:false,defval:''});
    document.getElementById('mBulkText').value=aoa.map(r=>r.join('\t')).join('\n');
  } else {
    alert('지원되지 않는 파일 형식입니다.'); return;
  }
  e.target.value='';
}
function parseBulkText(text,tab){
  const lines=text.split(/\r?\n/).map(l=>l).filter(l=>l.trim().length);
  if(!lines.length)return [];
  // 구분자 자동 감지: 탭 우선, 없으면 쉼표
  const firstSep = lines[0].indexOf('\t')>=0 ? '\t' : ',';
  // 헤더 행 감지: 첫 행 셀 중 2개 이상이 헤더 키워드와 정확히 시작하면 헤더로 간주
  let startIdx=0;
  const firstRow=lines[0].split(firstSep).map(s=>String(s).trim());
  const hdrKeys = tab==='cust'
    ? ['상호','거래처','사업자','대표자','전화','휴대','이메일','주소','업태','종목','담당자','메모','기초']
    : ['코드','품명','품목','그룹','규격','단위','매입','매출'];
  // "정확히 시작"이라야 헤더로 보고, 그런 셀이 2개 이상일 때만 헤더 행으로 처리
  const headerMatches = firstRow.filter(c=>hdrKeys.some(k=>c===k||c.startsWith(k))).length;
  if(headerMatches>=2)startIdx=1;
  const out=[];
  for(let i=startIdx;i<lines.length;i++){
    const cols=lines[i].split(firstSep).map(s=>String(s).trim());
    if(cols.every(c=>!c))continue;
    if(tab==='cust'){
      const [nm,biz,ceo,tel,mtel,email,addr,cat,item,mgr,memo,ar,ap]=cols;
      if(!nm)continue;
      out.push({nm,biz:biz||'',ceo:ceo||'',tel:tel||'',mtel:mtel||'',email:email||'',addr:addr||'',cat:cat||'',item:item||'',mgr:mgr||'',memo:memo||'',ar:+(ar||0)||0,ap:+(ap||0)||0,_u:1});
    } else {
      const [code,nm,grp,spec,unit,buy,sell]=cols;
      if(!code||!nm)continue;
      out.push({code,nm,grp:grp||'',spec:spec||'',unit:unit||'ea',buy:+(buy||0)||0,sell:+(sell||0)||0,_u:1});
    }
  }
  return out;
}
function runMasterBulk(tab){
  const txt=document.getElementById('mBulkText').value;
  const dup=document.getElementById('mBulkDup').value;
  const parsed=parseBulkText(txt,tab);
  if(!parsed.length){alert('등록할 데이터가 없습니다. 형식을 확인하세요.');return;}
  let added=0, replaced=0, skipped=0;
  if(tab==='cust'){
    parsed.forEach(o=>{
      const idx=UCUST.findIndex(c=>c.nm===o.nm);
      if(idx<0){UCUST.push(o);added++;}
      else if(dup==='replace'){UCUST[idx]={...UCUST[idx],...o};replaced++;}
      else{skipped++;}
    });
    saveCust();
  } else {
    parsed.forEach(o=>{
      const idx=UITEM.findIndex(i=>i.code===o.code);
      if(idx<0){UITEM.push(o);added++;}
      else if(dup==='replace'){UITEM[idx]={...UITEM[idx],...o};replaced++;}
      else{skipped++;}
    });
    saveItem();
  }
  rebuildMasters();
  alert(`완료: 추가 ${added}건, 덮어쓰기 ${replaced}건, 건너뜀 ${skipped}건`);
  renderMaster();
}

function dlOptions(arr){return arr.map(v=>`<option value="${esc(v)}">`).join('')}

/* 입력칸 검색형 자동완성 드롭다운
   - 타이핑하면 부분일치 + 초성(ㄱㄴㄷ)으로 실시간 필터
   - ▾ 버튼/클릭/포커스로 전체(또는 현재 입력 기준) 목록 표시
   - 직접 입력도 그대로 허용 */
let _ddOpen=null, _ddCloseActive=null, _ddJustPicked=false;
function ddItemNames(){return [...new Set(I.filter(i=>i.code&&i.nm).map(i=>i.nm))];}
// 한글 음절 → 초성 추출 (가→ㄱ, 나→ㄴ ...)
const _CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function _toCho(str){
  let out='';
  for(const ch of String(str)){
    const c=ch.charCodeAt(0);
    if(c>=0xAC00 && c<=0xD7A3){ out+=_CHO[Math.floor((c-0xAC00)/588)]; }
    else out+=ch;
  }
  return out;
}
// query가 초성으로만 이뤄졌는지 (ㄱㄴㄷ...)
function _isChoseong(q){ return /^[ㄱ-ㅎ]+$/.test(q); }
function ddFilter(list, q){
  q=(q||'').trim().toLowerCase();
  if(!q) return list.slice();
  const choMode=_isChoseong(q);
  return list.filter(v=>{
    const s=String(v).toLowerCase();
    if(s.includes(q)) return true;               // 부분일치
    if(choMode && _toCho(s).toLowerCase().includes(q)) return true; // 초성일치
    return false;
  });
}
function attachDropdown(inputId, getList){
  const inp=document.getElementById(inputId);
  if(!inp || !inp.parentElement) return;
  let wrap=inp.parentElement;
  if(!wrap.classList.contains('dd-wrap')){
    wrap=document.createElement('div'); wrap.className='dd-wrap';
    inp.parentNode.insertBefore(wrap, inp); wrap.appendChild(inp);
  }
  inp.classList.add('dd-input');
  inp.setAttribute('autocomplete','off');
  const old=wrap.querySelector('.dd-btn'); if(old)old.remove();
  const btn=document.createElement('button');
  btn.type='button'; btn.className='dd-btn'; btn.textContent='▾'; btn.tabIndex=-1;
  wrap.appendChild(btn);
  let _ddMenuEl=null;
  const closeMenu=()=>{ if(_ddMenuEl){_ddMenuEl.remove();_ddMenuEl=null;} _ddOpen=null; _ddCloseActive=null; document.removeEventListener('click',onDoc,true); };
  const onDoc=(e)=>{ if(!wrap.contains(e.target) && (!_ddMenuEl || !_ddMenuEl.contains(e.target))) closeMenu(); };
  const pick=(val)=>{
    inp.value=val;
    inp.dispatchEvent(new Event('input',{bubbles:true}));
    inp.dispatchEvent(new Event('change',{bubbles:true}));
    closeMenu();
    _ddJustPicked=true; setTimeout(()=>{_ddJustPicked=false;},250);
  };
  const renderMenu=(showAll)=>{
    const full=(getList()||[]).filter(Boolean);
    const matches = showAll ? full : ddFilter(full, inp.value);
    if(!_ddMenuEl){
      _ddMenuEl=document.createElement('div'); _ddMenuEl.className='dd-menu';
      document.body.appendChild(_ddMenuEl);
    }
    if(!full.length){ _ddMenuEl.innerHTML='<div class="dd-empty">목록이 없습니다</div>'; }
    else if(!matches.length){ _ddMenuEl.innerHTML='<div class="dd-empty">검색 결과 없음 · 직접 입력 가능</div>'; }
    else _ddMenuEl.innerHTML=matches.slice(0,50).map(v=>`<div class="dd-item${v===inp.value?' sel':''}" data-v="${esc(v)}">${esc(v)}</div>`).join('')
      + (matches.length>50?`<div class="dd-empty">… 외 ${matches.length-50}건 (검색해 좁히세요)</div>`:'');
    const r=inp.getBoundingClientRect();
    _ddMenuEl.style.position='fixed';
    _ddMenuEl.style.left=r.left+'px';
    _ddMenuEl.style.top=(r.bottom+4)+'px';
    _ddMenuEl.style.width=Math.max(r.width,160)+'px';
    _ddMenuEl.querySelectorAll('.dd-item').forEach(it=>it.onmousedown=(ev)=>{ ev.preventDefault(); pick(it.dataset.v); });
  };
  const openMenu=(showAll)=>{
    if(_ddJustPicked) return;
    if(_ddOpen && _ddOpen!==wrap && typeof _ddCloseActive==='function') _ddCloseActive();
    renderMenu(showAll);
    _ddOpen=wrap; _ddCloseActive=closeMenu;
    document.addEventListener('click',onDoc,true);
  };
  // ▾ 버튼/클릭/포커스 → 전체 목록 (선택값이 있어도 전체 표시)
  btn.onclick=(e)=>{ e.preventDefault(); e.stopPropagation(); if(_ddOpen===wrap){ closeMenu(); } else { openMenu(true); } };
  inp.addEventListener('focus', ()=>openMenu(true));
  inp.addEventListener('click', (e)=>{ e.stopPropagation(); if(_ddOpen!==wrap) openMenu(true); else renderMenu(true); });
  // 타이핑하면 입력값 기준 실시간 필터
  inp.addEventListener('input', ()=>{ if(_ddOpen===wrap) renderMenu(false); else openMenu(false); });
}
function custInfo(name){const c=C.find(x=>x.nm===name);return c||{nm:name||'',biz:'',ceo:'',tel:'',addr:'',email:'',cat:'',item:''};}
function acctList(g){ if(g==='수입')return S.수입계정||['매출']; if(g==='비용')return S.비용계정||['매입']; return [g]; }
/* VAT 계산: mode = 과세포함 | 과세별도 | 면세
   과세포함: 입력단가/금액에 VAT 포함 → 공급가=round(/1.1), vat=금액-공급가
   과세별도: 입력값=공급가 → vat=round(공급가*0.1), 합계=공급가+vat
   면세    : vat=0 */
function vatCalc(amount, mode){
  amount=Math.round(amount||0);
  if(mode==='면세') return {s:amount, v:0, t:amount};
  if(mode==='과세별도'){ const v=Math.round(amount*0.1); return {s:amount, v, t:amount+v}; }
  const s=Math.round(amount/1.1); return {s, v:amount-s, t:amount}; // 과세포함(기본)
}

async function applyAINaturalLanguage(text){
  const msg=document.getElementById('aiNLMsg');

  msg.innerHTML='<div class="hint">AI 분석 중... (3~10초)</div>';
  try{
    const parsed = await aiParseTransaction(text);
    // 모드 전환
    if(parsed.mode && ['sale','buy','exp'].includes(parsed.mode)){
      inMode=parsed.mode;
      document.querySelectorAll('#inSeg button').forEach(x=>x.classList.toggle('on',x.dataset.m===inMode));
    }
    // 폼 다시 그리기
    if(parsed.lines && parsed.lines.length){

    const memoEl=document.getElementById('fMemo'); if(memoEl && parsed.memo) memoEl.value=parsed.memo;
    const payEl=document.getElementById('fPay'); if(payEl) payEl.value=parsed.payment||'';
    const vatEl=document.getElementById('fVat'); if(vatEl && parsed.vat) vatEl.value=parsed.vat;

    // 라인 합계 다시 계산 — drawInForm()이 호출되면서 drawLines/inTotals를 다시 호출함
    if(typeof drawLines==='function') drawLines();

    if(parsed.confidence_low) html+='<br><span style="font-size:12px;color:var(--accent)">⚠ 일부 정보가 불확실합니다. 꼭 확인하세요.</span>';
    html+='</div>';

    // 변환 성공 시 자동 접힘 — 사용자가 채워진 폼을 바로 확인할 수 있게
    setTimeout(()=>{

  // 거래처 선택 시 → 그 거래처에 지정된 결제구분을 자동 선택 (매출·매입·비용 공통, 없으면 외상)
  const syncPartyPay=()=>{
    const pe=document.getElementById('fPay'); if(!pe) return;
    const nm=((document.getElementById('fParty')||{}).value||'').trim();
    if(!nm) return;
    const c=C.find(x=>x.nm===nm); if(!c) return;   // 정확히 일치하는 거래처만 반영
    const want=c.pay||'';
    pe.value=[...pe.options].some(o=>o.value===want)?want:'';
  };
  const _fpEl=document.getElementById('fParty');
  if(_fpEl){
    _fpEl.addEventListener('change', syncPartyPay);  // 드롭다운 선택·blur
    _fpEl.addEventListener('input', syncPartyPay);   // 거래처명 정확 입력 즉시(미일치는 무시)
  }
  syncPartyPay();   // 최초 렌더 시 프리필된 거래처(비용 탭 등)에도 반영
  if(isExp) attachDropdown('fAcct', ()=>expAccts());

  // ── 작성 중 초안 복원: 저장 안 한 입력값(거래처·일자·결제구분·VAT·적요·메모 등) 되살림
  if(!opts.noDraftLoad && dr && dr.f){
    Object.entries(dr.f).forEach(([id,v])=>{ const el=document.getElementById(id); if(el && v!=null && v!=='') el.value=v; });
    inTotals();
  }
  // ── 작성하는 동안 입력값을 계속 임시저장(메뉴/탭 이동에도 유지). 저장·초기화 시에만 비움
  f.oninput=captureInDraft;
  f.onchange=captureInDraft;
}

function drawLines(){
  const tb=document.getElementById('liBody'); if(!tb)return;
  const mode=(document.getElementById('fVat')||{}).value||'과세포함';
  const g=modeG();
  tb.innerHTML=inLines.map((l,i)=>{
    const amt=(l.q||0)*(l.pr||0); const vc=vatCalc(amt,mode);
    return `<tr data-i="${i}">
      <td><input data-k="nm" value="${esc(l.nm)}" placeholder="품명"></td>
      <td><input data-k="spec" value="${esc(l.spec)}" placeholder="규격"></td>
      <td><input data-k="unit" value="${esc(l.unit)}"></td>
      <td><input data-k="q" class="r" inputmode="numeric" value="${l.q}"></td>
      <td><input data-k="pr" class="r" inputmode="numeric" value="${l.pr}"></td>
      <td class="calc">${fmt(vc.t)}</td>
      <td>${inLines.length>1?`<button class="li-del" data-del="${i}">×</button>`:''}</td>
    </tr>`;}).join('');
  tb.querySelectorAll('input').forEach(inp=>{
    inp.oninput=e=>{const tr=e.target.closest('tr');const i=+tr.dataset.i;const k=e.target.dataset.k;
      inLines[i][k]=(k==='q'||k==='pr')?numv(e.target):e.target.value;
      // 품명 선택 시 품목 마스터에서 규격/단위/단가 자동 채움
      if(k==='nm'){const it=I.find(x=>x.nm===e.target.value);if(it){inLines[i].ic=it.code;if(it.spec&&!inLines[i].spec)inLines[i].spec=it.spec;if(it.unit)inLines[i].unit=it.unit;const dp=(g==='수입'?it.sell:it.buy);if(dp&&!inLines[i].pr)inLines[i].pr=dp;drawLines();}}
      const tr2=tb.querySelector(`tr[data-i="${i}"] .calc`);
      if(tr2){const amt=(inLines[i].q||0)*(inLines[i].pr||0);tr2.textContent=fmt(vatCalc(amt,(document.getElementById('fVat')||{}).value).t);}
      inTotals();};
  });
  tb.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{inLines.splice(+b.dataset.del,1);drawLines();inTotals();});
  // 품명 입력칸 ▾ 전체 품목 목록
  const itemNames=()=>[...new Set(I.filter(i=>i.code&&i.nm).map(i=>i.nm))];
  tb.querySelectorAll('input[data-k="nm"]').forEach((inp,i)=>{
    if(!inp.id) inp.id='liNm_'+i;
    attachDropdown(inp.id, itemNames);
  });
}

function inTotals(){
  const box=document.getElementById('inTot'); if(!box)return;
  const mode=(document.getElementById('fVat')||{}).value||'과세포함';
  let s=0,v=0,t=0;
  if(inMode==='exp'){
    const amt=numv(document.getElementById('fAmt')||{value:0}); const vc=vatCalc(amt,mode);s=vc.s;v=vc.v;t=vc.t;
  }else{
    inLines.forEach(l=>{const vc=vatCalc((l.q||0)*(l.pr||0),mode);s+=vc.s;v+=vc.v;t+=vc.t;});
  }
  box.innerHTML=`<div class="ti"><span>공급가액</span><b>${fmt(s)}</b></div>
    <div class="ti"><span>VAT</span><b>${fmt(v)}</b></div>
    <div class="ti"><span>합계금액</span><b style="color:var(--brand)">${fmt(t)}</b></div>`;
}

function saveEntry(){
  const g=modeG(), mode=document.getElementById('fVat').value;
  const d=document.getElementById('fDate').value||todayStr();
  const p=document.getElementById('fParty').value.trim();
  const acctEl=document.getElementById('fAcct'); // 비용 모드에만 존재
  const a=acctEl?acctEl.value.trim():'';
  const m=document.getElementById('fMemo').value.trim();
  const pm=document.getElementById('fPay').value.trim();
  const note=document.getElementById('fNote').value.trim();
  if(!p){alert('거래처를 입력하세요.');return;}
  const batch=uid(); const rows=[];
  if(inMode==='exp'){
    // 비용: 품목 없이 적요+금액만 (계정과목 공란 허용)
    const amt=numv(document.getElementById('fAmt'));
    if(!amt){alert('합계금액을 입력하세요.');return;}
    if(!m){alert('적요를 입력하세요.');return;}
    const vc=vatCalc(amt,mode);
    rows.push({id:uid(),batch,d,g,p,a,m,ic:'',inm:'',u:'',q:0,pr:0,s:vc.s,v:vc.v,t:vc.t,pm:pm||'',tax:'',vm:mode,note,_u:1});
  }else{
    // 매출/매입: 계정과목은 구분에 따라 자동(매출/매입)
    const acc0= (inMode==='sale')?'매출':'매입';
    const valid=inLines.filter(l=>l.nm&&(l.q||l.pr));
    if(!valid.length){alert('품목을 1개 이상 입력하세요.');return;}
    valid.forEach(l=>{const vc=vatCalc((l.q||0)*(l.pr||0),mode);
      rows.push({id:uid(),batch,d,g,p,a:acc0,m:m,ic:l.ic||'',inm:l.nm,spec:l.spec||'',u:l.unit||'ea',q:l.q||0,pr:l.pr||0,s:vc.s,v:vc.v,t:vc.t,pm:pm||'',tax:'',vm:mode,note,_u:1});});
  }
  // 중복 거래 경고: 같은 거래처·일자·합계의 거래가 이미 있으면 확인
  const newTotal=rows.reduce((x,r)=>x+r.t,0);
  const dup=USER.filter(t=>t.p===p && t.d===d && t.g===g);
  const dupTotal={};
  dup.forEach(t=>{ dupTotal[t.batch]=(dupTotal[t.batch]||0)+t.t; });
  const hasSame=Object.values(dupTotal).some(v=>v===newTotal);
  if(hasSame){
    const ml0={sale:'매출',buy:'매입',exp:'비용'}[inMode];
    if(!confirm(`같은 거래처·날짜·금액의 ${ml0} 거래가 이미 있습니다.\n\n· 거래처: ${p}\n· 일자: ${d}\n· 합계: ${fmt(newTotal)}원\n\n중복 입력일 수 있습니다. 그래도 저장할까요?`)) return;
  }
  USER=USER.concat(rows); saveUser(); rebuildT();
  const b=document.getElementById('inBanner');
  const ml={sale:'매출',buy:'매입',exp:'비용'}[inMode];
  b.innerHTML=`<div class="banner ok">✓ ${esc(p)} · ${ml} ${rows.length}건 저장 완료 (합계 ${fmt(rows.reduce((x,r)=>x+r.t,0))}원) · 거래조회에서 확인·수정할 수 있습니다.</div>`;
  setTimeout(()=>{b.innerHTML='';},5000);
  clearInDraft();   // 저장 완료 → 작성 중 초안 제거
  inLines=[{ic:'',nm:'',spec:'',unit:'ea',q:1,pr:0}];
  drawInForm();
}

      `· 임대 계약: ${fmt(counts.rentalContracts)}건`,
      `· 임대 카운터: ${fmt(counts.rentalMeters)}건`,

      '',

    if(Array.isArray(payload.customers)){UCUST=payload.customers; saveCust();}
    if(Array.isArray(payload.items)){UITEM=payload.items; saveItem();}
    if(Array.isArray(payload.rentalContracts)){RC=payload.rentalContracts; saveRC();}
    if(Array.isArray(payload.rentalMeters)){RM=payload.rentalMeters; saveRM();}
    if(Array.isArray(payload.asSchedule)){AS=payload.asSchedule; saveAS();}
    if(Array.isArray(payload.expAccounts)){ S.비용계정=['매입',...payload.expAccounts.filter(a=>a&&a!=='매입')]; saveExpAccts(); }
    if(Array.isArray(payload.payMethods)){ S.결제수단=payload.payMethods.slice(); savePayMethods(); }
    // 프로그램 설정 복원
    const st=payload.settings;
    if(st && typeof st==='object'){
      if(st.labels && typeof st.labels==='object'){ LBL_OVERRIDES=st.labels; saveLabels(); }
      if(Array.isArray(st.menuHidden)){ MENU_HIDDEN=st.menuHidden; saveMenuHidden(); }
      if(Array.isArray(st.menuOrder)){ MENU_ORDER=st.menuOrder; saveMenuOrder(); }
      if(st.theme && typeof st.theme==='object'){ THEME=st.theme; saveTheme(); }
      if(st.aiConfig && typeof st.aiConfig==='object'){ AI_CFG=st.aiConfig; saveAICfg(); }
      if(st.security){ lsSet(LS_SEC, st.security); }
      if(Array.isArray(st.lockedMenus)){ LOCKED_MENUS=st.lockedMenus.slice(); saveLockedMenus(); }
      if(typeof st.backupAlert==='boolean'){ try{localStorage.setItem(LS_BKPALERT,JSON.stringify(st.backupAlert));}catch(e){} }
      if(typeof st.dashMemo==='string'){ lsSet(LS_MEMO, st.dashMemo); }
      if(Array.isArray(st.dashOrder)){ lsSet(LS_DASHORDER, st.dashOrder); }
      if(st.issuer && typeof st.issuer==='object'){ ISSUER=Object.assign({},ISSUER_DEFAULT,st.issuer); saveIssuer(); }
      if(typeof st.seal==='string'){ SEAL=st.seal; saveSeal(); }
      if(st.sealCfg && typeof st.sealCfg==='object'){ SEALCFG=Object.assign(JSON.parse(JSON.stringify(SEALCFG_DEFAULT)),st.sealCfg); normalizeSealCfg(); saveSealCfg(); }
      if(st.contractText && typeof st.contractText==='object'){ CT=Object.assign(JSON.parse(JSON.stringify(CONTRACT_TEXT_DEFAULT)),st.contractText); saveContractText(); }
      if(typeof applyTheme==='function') applyTheme();
      if(typeof buildNav==='function') buildNav();

    e.target.value='';
    render();
  };
  rd.readAsText(file); e.target.value='';
}

/* 헤더명으로 자동 매핑 추정 */
function guessMap(headers){
  const norm=h=>String(h||'').replace(/[\s()]/g,'').toLowerCase();
  const rules={
    d:['일자','날짜','거래일','date'],
    p:['상호','거래처','업체','거래처명','customer'],
    cat:['품목분류','분류','category'],
    acct:['계정과목','계정','account'],
    inm:['품명','품목','모델','품명모델번호','item','제품'],
    q:['량','수량','qty','수'],
    pr:['단가','price','unit'],
    s:['공급가액','공급가','supply'],
    v:['부가세','세액','vat','부가가치세'],
    t:['금액','합계','총액','total','amount'],
    pm:['결제','결제구분','결제수단','수금','입금'],
    m:['비고','적요','메모','note','remark'],
  };
  const map={};
  headers.forEach((h,i)=>{const n=norm(h);
    for(const k in rules){if(map[k]!=null)continue;
      if(rules[k].some(t=>n===norm(t)||n.includes(norm(t)))){map[k]=i;break;}}
  });
  return map;
}
function onXlsxPick(e){
  const file=e.target.files[0]; e.target.value=''; if(!file)return;
  const panel=document.getElementById('importPanel');
  panel.innerHTML=`<div class="hint" style="margin-top:12px">파일을 읽는 중…</div>`;
  loadSheetJS().then(XLSX=>{
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const wb=XLSX.read(rd.result,{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
        if(!aoa.length){panel.innerHTML='<div class="banner" style="background:var(--expense-soft);color:var(--expense)">빈 시트입니다.</div>';return;}
        impHeaders=aoa[0].map(x=>String(x).trim());
        impRows=aoa.slice(1).filter(r=>r.some(c=>String(c).trim()!==''));
        impMap=guessMap(impHeaders);
        drawImportMap(file.name, wb.SheetNames[0], wb.SheetNames.length);
      }catch(err){panel.innerHTML='<div class="banner" style="background:var(--expense-soft);color:var(--expense)">엑셀을 읽지 못했습니다: '+esc(err.message)+'</div>';}
    };
    rd.readAsArrayBuffer(file);
  }).catch(err=>{panel.innerHTML='<div class="banner" style="background:var(--expense-soft);color:var(--expense)">'+esc(err.message)+'</div>';});
}

/* 날짜 정규화: 20190102 / 2019-01-02 / 2019.1.2 / Excel serial / Date → YYYY-MM-DD */
function _dateToLocalYMD(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function normDate(v){
  if(v==null||v==='')return '';
  if(v instanceof Date && !isNaN(v))return _dateToLocalYMD(v);
  let s=String(v).trim();
  if(/^\d{8}$/.test(s))return s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8);
  if(/^\d{4}[.\-\/]\d{1,2}[.\-\/]\d{1,2}/.test(s)){const p=s.split(/[.\-\/]/);return p[0]+'-'+String(p[1]).padStart(2,'0')+'-'+String(p[2]).padStart(2,'0');}
  // Excel serial number — Excel은 UTC 기준이지만 결과 날짜만 추출
  if(/^\d{4,5}(\.\d+)?$/.test(s)){const n=+s;const dt=new Date(Date.UTC(1899,11,30)+n*86400000);if(!isNaN(dt))return dt.toISOString().slice(0,10);}
  const dt=new Date(s); if(!isNaN(dt))return _dateToLocalYMD(dt);
  return s;
}
function num(v){const n=parseFloat(String(v==null?'':v).replace(/[,\s₩원]/g,''));return isNaN(n)?0:n;}
function buildImportRows(){
  const kind=(document.getElementById('impKind')||{value:'수입'}).value; // 수입 | 비용-매입 | 비용-기타
  const g = (kind==='수입')?'수입':'비용';
  const acctDefault = (kind==='수입')?'매출':(kind==='비용-매입')?'매입':'';
  const mode=document.getElementById('impVat').value;
  const get=(r,k)=>impMap[k]!=null?r[impMap[k]]:'';
  const out=[];
  for(const r of impRows){
    const p=String(get(r,'p')||'').trim();
    const d=normDate(get(r,'d'));
    if(!p||!d)continue; // 거래처·일자 없으면 스킵
    const q=num(get(r,'q'))||0, pr=num(get(r,'pr'))||0;
    let s,v,t;
    if(mode==='asis'){
      s=num(get(r,'s')); v=num(get(r,'v')); t=num(get(r,'t'));
      if(!t)t=s+v; if(!s&&t){const vc=vatCalc(t,'과세포함');s=vc.s;v=vc.v;}
    }else{
      // 단가·수량 기준 금액(있으면) → 없으면 합계열
      let base = (q&&pr)? q*pr : num(get(r,'t'))||num(get(r,'s'));
      const vc=vatCalc(base,mode); s=vc.s;v=vc.v;t=vc.t;
    }
    const inm=String(get(r,'inm')||'').trim();
    const cat=String(get(r,'cat')||'').trim();
    const acctCol=String(get(r,'acct')||'').trim();
    const pm=String(get(r,'pm')||'').trim();
    const m=String(get(r,'m')||'').trim()||inm;
    out.push({id:uid(),batch:'imp',d,g,p,a:(acctCol||acctDefault),m,ic:'',inm,u:'ea',q,pr,s,v,t,pm,tax:'',vm:(v>0?(mode==='과세별도'?'과세별도':'과세포함'):'면세'),note:cat?('분류:'+cat):'',_u:1,_imp:1});
  }
  return out;
}
function showImportPreview(){
  if(impMap.d==null||impMap.p==null){alert('일자와 거래처(상호) 열은 반드시 지정해야 합니다.');return;}

      // 체크됨 = 표시, 체크 해제 = 숨김
      const wantVisible = e.target.checked;
      const currentlyHidden = isMenuHidden(id);
      if(wantVisible && currentlyHidden){ toggleMenuHidden(id); }
      else if(!wantVisible && !currentlyHidden){ toggleMenuHidden(id); }
    };
  });
  document.getElementById('lblResetAll').onclick=()=>{
    if(!confirm('모든 명칭을 기본값으로 되돌립니다. 계속할까요?'))return;
    resetAllLabels();
    setActive();
    drawLabelsPane();
  };
}

/* ============================================================
   AI 설정 화면 — 제공자·키·모델 선택
   ============================================================ */
function drawAIPane(){
  const body=document.getElementById('mBody');
  const provider = AI_CFG.provider || '';
  const keys = AI_CFG.keys || {};
  const models = AI_CFG.models || {};
  body.innerHTML=`<div class="card panel">
    <div class="card-head"><h3>AI 설정</h3></div>
    <p class="hint" style="margin:0 0 14px;line-height:1.55">
      AI 기능을 사용하려면 API 키를 등록하세요. 키는 이 브라우저 안에만 저장되며 외부로 전송되지 않습니다.<br>
      <span style="color:var(--ink-faint)">개인 데이터를 다루므로 본인 명의의 키만 사용하시고, 키는 타인과 공유하지 마세요.</span>
    </p>
    <div class="fld" style="max-width:300px;margin-bottom:14px"><label>사용할 AI 제공자</label>
      <select class="select" id="aiProv">
        <option value="">— 선택 안 함 (AI 기능 끔) —</option>
        ${Object.entries(AI_PROVIDERS).map(([k,v])=>`<option value="${k}" ${provider===k?'selected':''}>${esc(v.label)}</option>`).join('')}
      </select></div>
    <div id="aiProvDetail"></div>
  </div>`;

  const detail=document.getElementById('aiProvDetail');
  function renderDetail(){
    const p=document.getElementById('aiProv').value;
    if(!p){detail.innerHTML='';return;}
    const def=AI_PROVIDERS[p];
    const curKey = keys[p]||'';
    const curModel = models[p] || def.defaultModel;
    detail.innerHTML=`
      <div class="card" style="padding:16px 18px;background:var(--surface-2);margin-bottom:14px">
        <div style="font-size:12.5px;color:var(--ink-soft);line-height:1.6">
          <b>${esc(def.label)}</b><br>
          🔑 ${esc(def.keyHint)}<br>
          💰 ${esc(def.free)}
        </div>
      </div>
      <div class="fld"><label>API 키</label>
        <input type="password" id="aiKey" value="${esc(curKey)}" placeholder="${p==='gemini'?'AIzaSy...':p==='claude'?'sk-ant-...':'sk-...'}" style="font-family:monospace;font-size:12.5px">
        <div class="hint" style="margin-top:4px">${curKey?'<span style="color:var(--collect)">● 저장됨</span>':'<span style="color:var(--ink-faint)">아직 입력 안 됨</span>'}</div>
      </div>
      <div class="fld" style="max-width:320px"><label>모델</label>
        <select class="select" id="aiModel">
          ${def.models.map(m=>`<option value="${m}" ${m===curModel?'selected':''}>${m}${m===def.defaultModel?' (권장)':''}</option>`).join('')}
        </select>
      </div>
      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="btn primary" id="aiSave">저장</button>
        <button class="btn" id="aiTestBtn">연결 테스트</button>
        <button class="btn danger" id="aiClearKey" style="margin-left:auto">이 제공자 키 삭제</button>
      </div>
      <div id="aiMsg" style="margin-top:12px"></div>
    `;
    document.getElementById('aiSave').onclick=()=>{
      AI_CFG.provider=p;
      AI_CFG.keys=AI_CFG.keys||{};
      AI_CFG.keys[p]=document.getElementById('aiKey').value.trim();
      AI_CFG.models=AI_CFG.models||{};
      AI_CFG.models[p]=document.getElementById('aiModel').value;
      saveAICfg();
      document.getElementById('aiMsg').innerHTML='<div class="banner ok">저장되었습니다.</div>';
      setTimeout(()=>drawAIPane(),800);
    };
    document.getElementById('aiTestBtn').onclick=async ()=>{
      const msg=document.getElementById('aiMsg');
      const k=document.getElementById('aiKey').value.trim();
      if(!k){msg.innerHTML='<div class="banner err">먼저 API 키를 입력하세요.</div>';return;}
      // 임시로 적용해서 테스트
      const prevProvider=AI_CFG.provider, prevKey=(AI_CFG.keys||{})[p], prevModel=(AI_CFG.models||{})[p];
      AI_CFG.provider=p;
      AI_CFG.keys=AI_CFG.keys||{}; AI_CFG.keys[p]=k;
      AI_CFG.models=AI_CFG.models||{}; AI_CFG.models[p]=document.getElementById('aiModel').value;
      msg.innerHTML='<div class="hint">테스트 중... (3~10초 소요)</div>';
      try{
        const r = await aiTest();
        msg.innerHTML=`<div class="banner ok">✓ 연결 성공!<br><span style="color:var(--ink-soft);font-size:12px">응답: ${esc(r.slice(0,100))}</span></div>`;
      }catch(e){
        msg.innerHTML=`<div class="banner err">✗ 연결 실패<br><span style="font-size:12px">${esc(e.message)}</span></div>`;
        // 실패 시 이전 값으로 되돌림(임의 변경 방지)
        AI_CFG.provider=prevProvider;
        if(prevKey!==undefined) AI_CFG.keys[p]=prevKey; else delete AI_CFG.keys[p];
        if(prevModel!==undefined) AI_CFG.models[p]=prevModel; else delete AI_CFG.models[p];
      }
    };
    document.getElementById('aiClearKey').onclick=()=>{
      if(!confirm(`${def.label}의 API 키를 삭제할까요?`))return;
      if(AI_CFG.keys) delete AI_CFG.keys[p];
      if(AI_CFG.models) delete AI_CFG.models[p];
      if(AI_CFG.provider===p) AI_CFG.provider='';
      saveAICfg();
      drawAIPane();
    };
  }
  renderDetail();
  document.getElementById('aiProv').onchange=()=>{ AI_CFG.provider=document.getElementById('aiProv').value; saveAICfg(); renderDetail(); };
}

    saveExpAccts(); drawAcctPane();
  };
  g('acctAdd').onclick=addNew;
  g('acctNew').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addNew();}});

  // 순서 이동 (매입 제외한 배열 기준 → 실제 S.비용계정 인덱스로 변환)
  const realIdx=i=>{ // i = accts(매입제외) 인덱스 → S.비용계정 인덱스
    const name=accts[i]; return (S.비용계정||[]).indexOf(name);
  };
  body.querySelectorAll('[data-acctup]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.acctup, ri=realIdx(i), rj=realIdx(i-1);
    const arr=S.비용계정; [arr[ri],arr[rj]]=[arr[rj],arr[ri]];
    saveExpAccts(); drawAcctPane();
  });
  body.querySelectorAll('[data-acctdn]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.acctdn, ri=realIdx(i), rj=realIdx(i+1);
    const arr=S.비용계정; [arr[ri],arr[rj]]=[arr[rj],arr[ri]];
    saveExpAccts(); drawAcctPane();
  });
  // 수정
  body.querySelectorAll('[data-acctedit]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.acctedit, old=accts[i];
    const v=prompt('계정과목명 수정:', old);
    if(v===null) return;
    const nv=v.trim();
    if(!nv){alert('빈 이름은 사용할 수 없습니다.');return;}
    if(nv===old){return;}
    if((S.비용계정||[]).includes(nv)){alert('이미 있는 계정과목입니다.');return;}
    const cnt=T.filter(t=>t.g==='비용'&&t.a===old).length;
    if(cnt>0 && !confirm(`"${old}" 계정으로 등록된 거래 ${cnt}건이 있습니다.\n이름을 "${nv}"(으)로 바꾸면 기존 거래의 계정명도 함께 변경됩니다. 계속할까요?`)) return;
    // S.비용계정 변경
    const ri=realIdx(i); S.비용계정[ri]=nv; saveExpAccts();
    // 기존 거래(사용자 거래만 수정 가능)의 계정명 일괄 변경
    if(cnt>0){
      USER.forEach(t=>{ if(t.g==='비용'&&t.a===old) t.a=nv; });
      saveUser(); rebuildT();
    }
    drawAcctPane();
  });
  // 삭제
  body.querySelectorAll('[data-acctdel]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.acctdel, name=accts[i];
    const cnt=T.filter(t=>t.g==='비용'&&t.a===name).length;
    if(cnt>0){
      alert(`"${name}" 계정으로 등록된 거래가 ${cnt}건 있어 삭제할 수 없습니다.\n먼저 해당 거래의 계정을 다른 것으로 바꾸거나, 이 계정의 이름을 수정해 사용하세요.`);
      return;
    }
    if(!confirm(`"${name}" 계정과목을 삭제할까요?`)) return;
    S.비용계정=(S.비용계정||[]).filter(a=>a!==name);
    saveExpAccts(); drawAcctPane();
  });

  // ===== 결제수단 관리 =====
  const addPay=()=>{
    const v=g('payNew').value.trim();
    if(!v) return;
    if((S.결제수단||[]).includes(v)){alert('이미 있는 결제수단입니다.');return;}
    S.결제수단=[...(S.결제수단||[]), v];
    savePayMethods(); drawAcctPane();
  };
  g('payAdd').onclick=addPay;
  g('payNew').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addPay();}});
  body.querySelectorAll('[data-payup]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.payup, arr=S.결제수단; [arr[i],arr[i-1]]=[arr[i-1],arr[i]];
    savePayMethods(); drawAcctPane();
  });
  body.querySelectorAll('[data-paydn]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.paydn, arr=S.결제수단; [arr[i],arr[i+1]]=[arr[i+1],arr[i]];
    savePayMethods(); drawAcctPane();
  });
  body.querySelectorAll('[data-payedit]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.payedit, old=S.결제수단[i];
    const v=prompt('결제수단명 수정:', old);
    if(v===null) return;
    const nv=v.trim();
    if(!nv){alert('빈 이름은 사용할 수 없습니다.');return;}
    if(nv===old) return;
    if((S.결제수단||[]).includes(nv)){alert('이미 있는 결제수단입니다.');return;}
    const cnt=T.filter(t=>t.pm===old).length;
    if(cnt>0 && !confirm(`"${old}" 결제수단으로 등록된 거래 ${cnt}건이 있습니다.\n이름을 "${nv}"(으)로 바꾸면 기존 거래도 함께 변경됩니다. 계속할까요?`)) return;
    S.결제수단[i]=nv; savePayMethods();
    if(cnt>0){ USER.forEach(t=>{ if(t.pm===old) t.pm=nv; }); saveUser(); rebuildT(); }
    drawAcctPane();
  });
  body.querySelectorAll('[data-paydel]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.paydel, name=S.결제수단[i];
    const cnt=T.filter(t=>t.pm===name).length;
    if(cnt>0){ alert(`"${name}" 결제수단으로 등록된 거래가 ${cnt}건 있어 삭제할 수 없습니다.\n먼저 해당 거래의 결제수단을 바꾸거나 이름을 수정해 사용하세요.`); return; }
    if(!confirm(`"${name}" 결제수단을 삭제할까요?`)) return;
    S.결제수단=(S.결제수단||[]).filter(x=>x!==name);
    savePayMethods(); drawAcctPane();
  });
}

/* ============================================================
   테마 설정 화면 — 스킨/글꼴/크기
   ============================================================ */
function drawThemePane(){
  const body=document.getElementById('mBody');
  const swatch = (sk)=>`<span style="display:inline-flex;gap:3px;vertical-align:middle;margin-right:8px">
    <i style="width:16px;height:16px;border-radius:4px;background:${sk.brand}"></i>
    <i style="width:16px;height:16px;border-radius:4px;background:${sk.brand2}"></i>
    <i style="width:16px;height:16px;border-radius:4px;background:${sk.accent}"></i></span>`;
  body.innerHTML=`<div class="card panel">
    <div class="card-head"><h3>테마 설정</h3></div>
    <p class="hint" style="margin:0 0 18px;line-height:1.55">색상 스킨, 글꼴, 글자 크기를 선택할 수 있습니다. 변경은 즉시 적용되고 브라우저에 저장됩니다.</p>

    <div style="margin-bottom:22px">
      <h4 style="margin:0 0 10px;font-size:14px;color:var(--ink-soft);font-weight:700">색상 스킨</h4>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px">
        ${Object.entries(SKINS).map(([k,sk])=>`
          <button class="theme-opt ${THEME.skin===k?'sel':''}" data-skin="${k}"
            style="display:flex;align-items:center;padding:11px 13px;border:1.5px solid ${THEME.skin===k?'var(--brand)':'var(--border-strong)'};border-radius:9px;background:${THEME.skin===k?'var(--brand-soft)':'var(--surface)'};cursor:pointer;text-align:left;font-size:13px;font-weight:${THEME.skin===k?'700':'500'}">
            ${swatch(sk)}<span>${esc(sk.label)}</span>
          </button>`).join('')}
        ${(()=>{const csk=deriveSkin(THEME.custom.brand,THEME.custom.accent);const on=THEME.skin==='custom';return `
          <button class="theme-opt ${on?'sel':''}" data-skin="custom"
            style="display:flex;align-items:center;padding:11px 13px;border:1.5px solid ${on?'var(--brand)':'var(--border-strong)'};border-radius:9px;background:${on?'var(--brand-soft)':'var(--surface)'};cursor:pointer;text-align:left;font-size:13px;font-weight:${on?'700':'500'}">
            ${swatch(csk)}<span>🎨 사용자 지정</span>
          </button>`;})()}
      </div>
      ${THEME.skin==='custom'?`
      <div style="margin-top:12px;border:1px solid var(--border);border-radius:10px;padding:14px 16px;background:var(--surface-2)">
        <div style="font-weight:700;font-size:13px;margin-bottom:12px">사용자 지정 색상</div>
        <div style="display:flex;gap:26px;flex-wrap:wrap;align-items:center">
          <label style="display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;cursor:pointer">브랜드 색상
            <input type="color" id="cusBrand" value="${esc(THEME.custom.brand)}" style="width:46px;height:32px;padding:0;border:1px solid var(--border-strong);border-radius:6px;background:none;cursor:pointer"></label>
          <label style="display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;cursor:pointer">포인트 색상
            <input type="color" id="cusAccent" value="${esc(THEME.custom.accent)}" style="width:46px;height:32px;padding:0;border:1px solid var(--border-strong);border-radius:6px;background:none;cursor:pointer"></label>
          <button class="btn sm" id="cusReco" style="margin-left:auto">추천값으로</button>
        </div>
        <div class="hint" style="margin-top:10px;line-height:1.55">브랜드 색상 하나로 버튼·헤더·활성 표시·연한 배경(hover)이 자동으로 만들어집니다. 포인트 색상은 강조(⚠·배지 등)에 쓰입니다.</div>
      </div>`:''}
    </div>

    <div style="margin-bottom:22px">
      <h4 style="margin:0 0 10px;font-size:14px;color:var(--ink-soft);font-weight:700">글꼴</h4>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px">
        ${Object.entries(FONTS).map(([k,f])=>`
          <button class="theme-opt ${THEME.font===k?'sel':''}" data-font="${k}"
            style="padding:11px 13px;border:1.5px solid ${THEME.font===k?'var(--brand)':'var(--border-strong)'};border-radius:9px;background:${THEME.font===k?'var(--brand-soft)':'var(--surface)'};cursor:pointer;text-align:left;font-size:14px;font-weight:${THEME.font===k?'700':'500'};font-family:${f.stack}">
            ${esc(f.label)}<div style="font-size:12px;color:var(--ink-faint);font-weight:400;margin-top:2px;font-family:${f.stack}">가나다 ABC 12,345원</div>
          </button>`).join('')}
      </div>
    </div>

    <div style="margin-bottom:8px">
      <h4 style="margin:0 0 10px;font-size:14px;color:var(--ink-soft);font-weight:700">글자 크기</h4>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${Object.entries(SIZES).map(([k,s])=>`
          <button class="theme-opt ${THEME.size===k?'sel':''}" data-size="${k}"
            style="padding:10px 22px;border:1.5px solid ${THEME.size===k?'var(--brand)':'var(--border-strong)'};border-radius:9px;background:${THEME.size===k?'var(--brand-soft)':'var(--surface)'};cursor:pointer;font-size:${s.px};font-weight:${THEME.size===k?'700':'500'}">
            ${esc(s.label)}
          </button>`).join('')}
      </div>
    </div>

    <div style="margin-top:22px;padding-top:16px;border-top:1px solid var(--border)">
      <button class="btn" id="themeReset">기본 테마로 초기화</button>
    </div>
  </div>`;

  body.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{ THEME.skin=b.dataset.skin; saveTheme(); applyTheme(); drawThemePane(); });
  body.querySelectorAll('[data-font]').forEach(b=>b.onclick=()=>{ THEME.font=b.dataset.font; saveTheme(); applyTheme(); drawThemePane(); });
  body.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{ THEME.size=b.dataset.size; saveTheme(); applyTheme(); drawThemePane(); });
  // 사용자 지정 색상: 고르는 동안 실시간 적용(input), 선택 완료 시 저장·다시 그리기(change)
  const cb=document.getElementById('cusBrand'), ca=document.getElementById('cusAccent');
  if(cb){ cb.oninput=()=>{ THEME.custom.brand=cb.value; applyTheme(); };
          cb.onchange=()=>{ THEME.custom.brand=cb.value; saveTheme(); applyTheme(); drawThemePane(); }; }
  if(ca){ ca.oninput=()=>{ THEME.custom.accent=ca.value; applyTheme(); };
          ca.onchange=()=>{ THEME.custom.accent=ca.value; saveTheme(); applyTheme(); drawThemePane(); }; }
  const cr=document.getElementById('cusReco');
  if(cr) cr.onclick=()=>{ THEME.custom={...THEME_DEFAULT.custom}; saveTheme(); applyTheme(); drawThemePane(); };
  document.getElementById('themeReset').onclick=()=>{ THEME={...THEME_DEFAULT, custom:{...THEME_DEFAULT.custom}}; saveTheme(); applyTheme(); drawThemePane(); };
}

function showEnableForm(){
  const f=document.getElementById('secForm');
  f.innerHTML=`
    <div class="card" style="padding:16px 18px">
      <div class="fld"><label>새 암호</label>
        <input type="password" id="secP1" placeholder="4자 이상" style="font-family:monospace" autocomplete="new-password">
      </div>
      <div class="fld"><label>새 암호 (확인)</label>
        <input type="password" id="secP2" placeholder="같은 암호를 다시" style="font-family:monospace" autocomplete="new-password">
      </div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn primary" id="secSave">저장</button>
        <button class="btn" id="secCancel">취소</button>
      </div>
    </div>`;
  document.getElementById('secP1').focus();
  document.getElementById('secCancel').onclick=()=>drawSecPane();
  const submit=async ()=>{
    const p1=document.getElementById('secP1').value;
    const p2=document.getElementById('secP2').value;
    const msg=document.getElementById('secMsg');
    if(p1.length<4){msg.innerHTML='<div class="banner err">암호는 4자 이상이어야 합니다.</div>';return;}
    if(p1!==p2){msg.innerHTML='<div class="banner err">두 입력이 일치하지 않습니다.</div>';return;}
    await secSet(p1);
    msg.innerHTML='<div class="banner ok">잠금 암호가 설정되었습니다. 다음 실행부터 적용됩니다.</div>';
    setTimeout(()=>drawSecPane(),1200);
  };
  document.getElementById('secSave').onclick=submit;
  ['secP1','secP2'].forEach(id=>document.getElementById(id).addEventListener('keydown',e=>{if(e.key==='Enter')submit();}));
}

function showChangeForm(){
  const f=document.getElementById('secForm');
  f.innerHTML=`
    <div class="card" style="padding:16px 18px;margin-top:8px">
      <div class="fld"><label>현재 암호</label>
        <input type="password" id="secCur" placeholder="현재 사용 중인 암호" style="font-family:monospace" autocomplete="current-password">
      </div>
      <div class="fld"><label>새 암호</label>
        <input type="password" id="secP1" placeholder="4자 이상" style="font-family:monospace" autocomplete="new-password">
      </div>
      <div class="fld"><label>새 암호 (확인)</label>
        <input type="password" id="secP2" placeholder="같은 암호를 다시" style="font-family:monospace" autocomplete="new-password">
      </div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn primary" id="secSave">변경</button>
        <button class="btn" id="secCancel">취소</button>
      </div>
    </div>`;
  document.getElementById('secCur').focus();
  document.getElementById('secCancel').onclick=()=>{f.innerHTML='';document.getElementById('secMsg').innerHTML='';};
  document.getElementById('secSave').onclick=async ()=>{
    const cur=document.getElementById('secCur').value;
    const p1=document.getElementById('secP1').value;
    const p2=document.getElementById('secP2').value;

function doExport(){
  if(!window.XLSX){
    // SheetJS 동적 로드
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload=()=>doExport();
    s.onerror=()=>alert('엑셀 라이브러리 로드 실패 (인터넷 연결 필요)');
    document.head.appendChild(s);
    return;
  }
  const XLSX=window.XLSX;
  const rows=expFilteredRows();
  if(!rows.length){alert('내보낼 거래가 없습니다.');return;}
  const wb=XLSX.utils.book_new();
  let aoa, sheetName;
  if(expState.kind==='cust'){
    // 거래처별 집계
    const m={};
    rows.forEach(t=>{const k=t.p||'(미지정)';(m[k]=m[k]||{party:k,cnt:0,sale:0,buy:0,exp:0,col:0,pay:0});
      m[k].cnt++;
      if(t.g==='수입')m[k].sale+=t.t;
      else if(t.g==='비용'&&t.a==='매입')m[k].buy+=t.t;
      else if(t.g==='비용')m[k].exp+=t.t;
      else if(t.g==='수금')m[k].col+=t.t;
      else if(t.g==='지급')m[k].pay+=t.t;});
    const arr=Object.values(m).sort((a,b)=>(b.sale+b.buy)-(a.sale+a.buy));
    aoa=[['거래처','건수','매출','매입','비용','수금','지급']];
    arr.forEach(x=>aoa.push([x.party,x.cnt,x.sale,x.buy,x.exp,x.col,x.pay]));
    sheetName='거래처별';
  } else if(expState.kind==='month'){
    const m={};
    rows.forEach(t=>{const k=(t.d||'').slice(0,7);if(!k)return;(m[k]=m[k]||{m:k,inc:0,exp:0,col:0,pay:0});
      if(t.g==='수입')m[k].inc+=t.t;else if(t.g==='비용')m[k].exp+=t.t;
      else if(t.g==='수금')m[k].col+=t.t;else if(t.g==='지급')m[k].pay+=t.t;});
    const arr=Object.keys(m).sort().map(k=>m[k]);
    aoa=[['월','매출','매입·비용','수금','지급','순이익']];
    arr.forEach(x=>aoa.push([x.m,x.inc,x.exp,x.col,x.pay,x.inc-x.exp]));
    sheetName='월별';
  } else if(expState.kind==='acct'){
    const m={};
    rows.forEach(t=>{if(t.g!=='수입'&&t.g!=='비용')return;const k=t.a||'(미지정)';(m[k]=m[k]||{a:k,g:t.g,cnt:0,sup:0,vat:0,tot:0});
      m[k].cnt++;m[k].sup+=t.s;m[k].vat+=t.v;m[k].tot+=t.t;});
    const arr=Object.values(m).sort((a,b)=>b.tot-a.tot);
    aoa=[['계정과목','구분','건수','공급가액','VAT','합계']];
    arr.forEach(x=>aoa.push([x.a,x.g,x.cnt,x.sup,x.vat,x.tot]));
    sheetName='계정별';
  } else {
    // 기본: 상세 내역
    aoa=[['일자','구분','거래처','계정과목','품명','적요','수량','단가','공급가액','부가세','합계','결제구분','메모']];
    rows.sort((a,b)=>(a.d||'').localeCompare(b.d||''))
      .forEach(t=>aoa.push([t.d,txClass(t),t.p,t.a,t.inm||'',t.m||'',t.q||0,t.pr||0,t.s||0,t.v||0,t.t||0,t.pm||'',t.note||'']));
    // 합계 행
    const tt=rows.reduce((a,t)=>({s:a.s+t.s,v:a.v+t.v,t:a.t+t.t}),{s:0,v:0,t:0});
    aoa.push(['합계','','','','','','','',tt.s,tt.v,tt.t,'','']);
    sheetName='거래내역';
  }
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  // 컬럼 폭 자동
  ws['!cols']=aoa[0].map((h,i)=>{let max=String(h).length;for(let r=1;r<Math.min(aoa.length,200);r++){const v=aoa[r][i];const l=String(v==null?'':v).length;if(l>max)max=l;}return {wch:Math.min(Math.max(max+2,8),28)};});
  XLSX.utils.book_append_sheet(wb,ws,sheetName);
  const period=[expState.year||'전체', expState.month?(+expState.month.slice(5)+'월'):''].filter(Boolean).join('_');
  const fname=`SCI_${sheetName}_${period||'전체'}_${todayStr()}.xlsx`;
  XLSX.writeFile(wb,fname);
}

   ============================================================ */

/* 임대료 계산 — 추가사용량은 한도 미만 0 */
function calcRental(c, prevM, prevC, currM, currC, discount){
  prevM=+prevM||0; prevC=+prevC||0; currM=+currM||0; currC=+currC||0;
  // 카운터 리셋(역전) 시 사용량을 0으로 처리 (사용자가 비고로 보정)
  const usedM = currM>=prevM ? (currM-prevM) : 0;
  const usedC = currC>=prevC ? (currC-prevC) : 0;
  const extraM = Math.max(0, usedM - (+c.contractM||0));
  const extraC = Math.max(0, usedC - (+c.contractC||0));
  const feeM = extraM * (+c.extraM||0);
  const feeC = extraC * (+c.extraC||0);
  const base = +c.basePrice||0;
  const total = Math.max(0, base + feeM + feeC - (+discount||0));
  return {usedM, usedC, extraM, extraC, feeM, feeC, base, total};
}
/* 완료된 청구는 단가 스냅샷(priceSnap)을 사용 — 이후 계약 단가가 바뀌어도 영향 X */
function effectiveContract(c, m){
  if(m && m.completed && m.priceSnap){
    return Object.assign({}, c, m.priceSnap);
  }
  return c;
}

/* 직전 월의 currM/currC를 다음 달 prevM/prevC로 자동 carry */
function prevReading(contractId, ym){
  // ym = 'YYYY-MM'. 이전 달 또는 그 이전 가장 가까운 카운터 사용
  const rms = RM.filter(r=>r.contractId===contractId && r.ym<ym).sort((a,b)=>b.ym.localeCompare(a.ym));
  if(rms.length) return {prevM:+rms[0].currM||0, prevC:+rms[0].currC||0};
  // 없으면 계약의 이월카운터(initialM/initialC) 사용
  const c=RC.find(x=>x.id===contractId);
  return {prevM:+(c&&c.initialM)||0, prevC:+(c&&c.initialC)||0};
}

function rentalLabel(c, ym){
  const eq = c.eqNo?` · 장비${c.eqNo}`:'';
  return `임대료 ${ym}${eq}`;
}

function rentalDateOf(ym, c){
  // 청구일자: 계약의 마감일(closeDay) — 5/10/15/20/25/말일(99) 중 하나
  let d = +c.closeDay || 5;
  if(d >= 99 || d > 28){
    // 말일: 해당 월의 마지막 날
    d = new Date(+ym.slice(0,4), +ym.slice(5,7), 0).getDate();
  }
  return `${ym}-${String(d).padStart(2,'0')}`;
}
// 마감일 라벨 (5/10/.../말일)
function closeDayLabel(d){
  d = +d || 5;
  return d >= 99 ? '말일' : String(d).padStart(2,'0')+'일';
}

      <td class="muted">${esc(c.installDate||'')}</td>
      <td class="muted">${esc(c.model||'')}</td>

      <td class="r muted">${c.extraM||c.extraC?`${fmt(c.extraM||0)} / ${fmt(c.extraC||0)}`:'-'}</td>
      <td class="muted">${c.vatIncluded?'포함':'면세'}</td>

      <td class="r act"><button class="btn xs" data-rcedit="${c.id}">수정</button></td>
    </tr>`).join('')}
    </tbody></table></div>`;
    const cardsHtml=`<div class="tcards">
    ${list.map(c=>`<div class="tcard">
      <div class="top">
        <div class="l">
          <div class="party">${esc(c.party)||'(거래처 미지정)'}</div>
          <div class="date">${esc(c.eqNo||'-')}${c.model?' · '+esc(c.model):''}</div>
        </div>
        <div class="amt">${won(c.basePrice||0)}</div>
      </div>
      <div class="meta">
        <div class="m"><span>상태</span>${c.active!==false?'<b style="color:var(--income)">사용중</b>':'<span class="muted">해지/만료</span>'}</div>
        <div class="m"><span>마감일</span>매월 ${closeDayLabel(c.closeDay||5)}</div>
        ${c.installDate?`<div class="m"><span>설치일</span>${esc(c.installDate)}</div>`:''}
        ${c.serial?`<div class="m"><span>일련번호</span>${esc(c.serial)}</div>`:''}
        <div class="m"><span>계약 M/C</span>${fmt(c.contractM||0)} / ${fmt(c.contractC||0)}</div>
        ${(c.extraM||c.extraC)?`<div class="m"><span>추가단가 M/C</span>${fmt(c.extraM||0)} / ${fmt(c.extraC||0)}</div>`:''}
        <div class="m"><span>VAT</span>${c.vatIncluded?'포함':'면세'}</div>
        ${c.memo?`<div class="m"><span>메모</span>${esc(c.memo)}</div>`:''}
        <div style="margin-top:8px"><button class="btn sm" data-rcedit="${c.id}" style="width:100%">수정</button></div>
      </div>
    </div>`).join('')}
    </div>`;
    wrap.innerHTML=tableHtml+cardsHtml;
    wrap.querySelectorAll('[data-rcedit]').forEach(b=>b.onclick=()=>{rentalEdit=b.dataset.rcedit;drawRentalList();window.scrollTo({top:0,behavior:'smooth'});});
  }
  renderRcList();

  // 검색 입력 핸들러 — input 요소는 재생성하지 않고 표만 갱신 (한글 조합 유지)
  const sInp=document.getElementById('rcSearch');
  if(sInp){
    sInp.oninput=(e)=>{ rentalSearch=e.target.value; renderRcList(); };
  }
  if(rentalEdit){
    const $=(id)=>document.getElementById(id);
    $('rcCancel').onclick=()=>{rentalEdit=null;drawRentalList();};
    attachDropdown('rcParty', partyNames);
    // 계약 시작일 + 기간(개월) → 종료일 자동 계산
    const calcEnd=()=>{
      const start=$('rcCStart').value;
      const months=parseInt($('rcCMonths').value,10);
      if(start && months>0){
        const d=new Date(start);
        d.setMonth(d.getMonth()+months);
        d.setDate(d.getDate()-1); // 시작일 포함 만기일 = 시작 + N개월 - 1일
        $('rcCEnd').value=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      } else {
        $('rcCEnd').value='';
      }
    };
    $('rcCStart').addEventListener('change',calcEnd);
    $('rcCMonths').addEventListener('input',calcEnd);
    $('rcSave').onclick=()=>{
      const obj={
        id:(rentalEdit==='new')?uid():rentalEdit,
        party:$('rcParty').value.trim(),
        eqNo:$('rcEqNo').value.trim(),
        model:$('rcModel').value.trim(),
        serial:$('rcSerial').value.trim(),
        installDate:$('rcInstall').value,
        closeDay:+$('rcCloseDay').value||5,
        basePrice:+$('rcBase').value||0,
        contractM:+$('rcCM').value||0,
        contractC:+$('rcCC').value||0,
        extraM:+$('rcEM').value||0,
        extraC:+$('rcEC').value||0,
        vatIncluded:$('rcVat').value==='1',
        initialM:+$('rcIM').value||0,
        initialC:+$('rcIC').value||0,
        active:$('rcActive').value==='1',
        memo:$('rcMemo').value.trim(),
        contractStart:$('rcCStart').value||'',
        contractMonths:parseInt($('rcCMonths').value,10)||'',
        contractEnd:$('rcCEnd').value||'',
        installAddr:$('rcAddr').value.trim()
      };
      if(!obj.party){alert('거래처를 입력하세요.');return;}
      if(rentalEdit==='new')RC.push(obj);
      else{const i=RC.findIndex(x=>x.id===rentalEdit); if(i>=0)RC[i]=obj;}
      saveRC(); rentalEdit=null; drawRentalList();
    };
    const delB=$('rcDel'); if(delB)delB.onclick=()=>{
      // 연결된 카운터·매출 확인
      const linkedMeters=RM.filter(r=>r.contractId===rentalEdit);
      const linkedSales=linkedMeters.filter(r=>r.salesTxId).length;
      const msg=linkedMeters.length?`이 장비의 월 카운터 ${linkedMeters.length}건${linkedSales?`(매출 등록된 ${linkedSales}건 포함)`:''}이 함께 삭제됩니다. 계속할까요?`:`이 장비 계약을 삭제할까요?`;
      if(!confirm(msg))return;
      // 매출 거래도 정리
      const sids=new Set(linkedMeters.map(r=>r.salesTxId).filter(Boolean));
      if(sids.size){USER=USER.filter(x=>!sids.has(x.id));saveUser();rebuildT();}
      RM=RM.filter(r=>r.contractId!==rentalEdit); saveRM();
      RC=RC.filter(c=>c.id!==rentalEdit); saveRC();
      rentalEdit=null; drawRentalList();
    };
  }
}

/* ----- 월 카운터 입력 (메인 화면) ----- */
function drawRentalMonth(){
  const body=document.getElementById('rentalBody');
  // 활성 장비
  const allActive = RC.filter(c=>c.active!==false).sort((a,b)=>(a.party||'').localeCompare(b.party||'','ko'));
  // 일자 필터 적용 (해당 마감일 가진 계약만)
  const dayQ = (rentalDayFilter||'').toString();
  const dayActive = dayQ ? allActive.filter(c=>String(+c.closeDay||5)===dayQ) : allActive;
  // 선택된 거래처가 현재 일자 필터에 더이상 맞지 않으면 자동 해제
  if(rentalMonthParty && dayQ){
    const stillMatches = dayActive.some(c=>c.party===rentalMonthParty);
    if(!stillMatches) rentalMonthParty='';
  }
  // 거래처 필터 적용
  const partyQ = (rentalMonthParty||'').trim();
  const active = partyQ ? dayActive.filter(c=>c.party===partyQ) : dayActive;
  // 일자 필터에 따른 검색 대상 거래처
  const activeParties = [...new Set(dayActive.map(c=>c.party))].sort((a,b)=>a.localeCompare(b,'ko'));
  // 각 계약별로 현재 ym의 카운터 row를 찾거나 새로
  const rows = active.map(c=>{
    let m = RM.find(r=>r.contractId===c.id && r.ym===rentalYM);
    const prev = prevReading(c.id, rentalYM);
    if(!m){
      m = {id:uid(),contractId:c.id,ym:rentalYM,closeDate:rentalDateOf(rentalYM,c),
           prevM:prev.prevM,prevC:prev.prevC,currM:'',currC:'',discount:0,
           actualAmount:null,memo:'',completed:false,salesTxId:null,_new:true};
    } else if(!m.completed){
      // 완료된 카운터는 prevM/prevC도 그 시점 그대로 보존(이전 달 변경 시에도 잠금)
      m.prevM = prev.prevM; m.prevC = prev.prevC;
    }
    const calc = calcRental(effectiveContract(c,m), m.prevM, m.prevC, m.currM||0, m.currC||0, m.discount);
    return {c,m,calc};
  });
  const totalClaim = rows.reduce((s,r)=>{
    const v = (r.m.actualAmount!=null && r.m.actualAmount!=='') ? +r.m.actualAmount : r.calc.total;
    return s + (r.m.completed||(r.m.currM!=null&&r.m.currM!=='')?v:0);
  },0);
  const completedCnt = rows.filter(r=>r.m.completed).length;
  // 일자 단축 버튼 옵션 (말일은 99 sentinel)
  const dayBtns = [5,10,15,20,25,99];

  // 기 청구 이력 — 거래처가 선택됐을 때만 표시, 완료건만, 현재 청구월 제외.
  let historyHtml='';
  if(partyQ){
    // 거래처가 바뀌면 장비 필터도 리셋
    if(histRangeParty !== partyQ){ histEqFilter=''; histShowInactive=false; }
    // 이 거래처의 계약(장비) 목록 — 사용중 / 해지·만료 분리
    const partyConts = RC.filter(c=>c.party===partyQ);
    const activeConts = partyConts.filter(c=>c.active!==false);
    const inactiveConts = partyConts.filter(c=>c.active===false);
    const multiEq = partyConts.length >= 2;
    const historyMeters = RM.filter(m=>{
      if(!m.completed) return false;        // 완료된 것만
      if(m.ym === rentalYM) return false;   // 현재 청구월은 진행 중이므로 제외
      const c = RC.find(rc=>rc.id===m.contractId);
      if(!c || c.party !== partyQ) return false;
      if(histEqFilter && m.contractId !== histEqFilter) return false; // 장비 필터
      return true;
    }).sort((a,b)=>{
      const yc=(b.ym||'').localeCompare(a.ym||'');
      if(yc!==0) return yc;
      return (b.closeDate||'').localeCompare(a.closeDate||'');
    });
    // 월별로 그룹화 → 같은 월은 함께 인쇄 가능
    const byYm={};
    historyMeters.forEach(m=>{(byYm[m.ym]=byYm[m.ym]||[]).push(m);});
    const allSortedYms = Object.keys(byYm).sort((a,b)=>b.localeCompare(a)); // 내림차순(최신 위)
    const allYms = allSortedYms.slice().reverse(); // 오름차순
    const defStart = allYms.length ? allYms[Math.max(0, allYms.length-12)] : '';
    const defEnd = allYms.length ? allYms[allYms.length-1] : '';
    // 거래처가 바뀌면 범위 리셋
    if(histRangeParty !== partyQ){ histRangeStart=''; histRangeEnd=''; histRangeParty=partyQ; }
    const effStart = histRangeStart || defStart;
    const effEnd = histRangeEnd || defEnd;
    // 범위 안의 ym만 화면에 표시
    const sortedYms = allSortedYms.filter(ym => ym>=effStart && ym<=effEnd);
    const shownCount = sortedYms.reduce((s,ym)=>s+byYm[ym].length,0);
    historyHtml = `<div class="card panel" style="margin-top:16px">
      <div class="panel-head"><h3>${esc(partyQ)} — 기 청구 이력 ${historyMeters.length?`· <span style="color:var(--ink-faint);font-weight:500">완료 ${historyMeters.length}건</span>`:''}</h3></div>
      ${historyMeters.length||histEqFilter?`
      ${multiEq?`<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
        <span class="hint" style="margin:0;margin-right:4px">장비별 조회:</span>
        <button class="btn xs ${!histEqFilter?'primary':''}" data-histeq="">전체 (${activeConts.length}대${inactiveConts.length&&histShowInactive?'+'+inactiveConts.length:''})</button>
        ${activeConts.map(pc=>`<button class="btn xs ${histEqFilter===pc.id?'primary':''}" data-histeq="${pc.id}">${esc(pc.eqNo?'장비'+pc.eqNo:'')}${esc(pc.model?(pc.eqNo?' · ':'')+pc.model:'')||esc(pc.id.slice(-4))}</button>`).join('')}
        ${histShowInactive ? inactiveConts.map(pc=>`<button class="btn xs ${histEqFilter===pc.id?'primary':''}" data-histeq="${pc.id}" style="opacity:.7" title="해지/만료된 장비">${esc(pc.eqNo?'장비'+pc.eqNo:'')}${esc(pc.model?(pc.eqNo?' · ':'')+pc.model:'')||esc(pc.id.slice(-4))} <span style="font-size:9px;color:var(--expense)">해지</span></button>`).join('') : ''}
        ${inactiveConts.length?`<button class="btn xs" id="histToggleInactive" style="margin-left:4px;border-style:dashed">${histShowInactive?'해지/만료 숨기기':`해지/만료 보기 (${inactiveConts.length})`}</button>`:''}
      </div>`:''}
      <div style="display:flex;gap:10px;align-items:end;flex-wrap:wrap;padding:10px 12px;background:var(--surface-2);border-radius:8px;margin-bottom:12px">
        <div class="fld" style="margin:0"><label>시작 월</label>
          <input type="month" id="histStart" value="${effStart}" min="${allYms[0]||''}" max="${allYms[allYms.length-1]||''}" style="height:36px;padding:0 10px;border:1px solid var(--border-strong);border-radius:7px;background:#fff;font-size:13px"></div>
        <div class="fld" style="margin:0"><label>종료 월</label>
          <input type="month" id="histEnd" value="${effEnd}" min="${allYms[0]||''}" max="${allYms[allYms.length-1]||''}" style="height:36px;padding:0 10px;border:1px solid var(--border-strong);border-radius:7px;background:#fff;font-size:13px"></div>
        <button class="btn primary" id="histRangePrint" style="height:36px">🖨 선택 범위 일괄 인쇄</button>
        <button class="btn" id="histRangeReset" style="height:36px">전체</button>
        <span class="hint" style="margin:0">범위 내 ${sortedYms.length}개월 · ${shownCount}건${histEqFilter?' · 선택 장비만':''} 표시 중</span>
      </div>
      `:''}
      ${historyMeters.length?(sortedYms.length?sortedYms.map(ym=>{
        const ms=byYm[ym];
        const ymTot=ms.reduce((s,m)=>{
          const c=RC.find(rc=>rc.id===m.contractId)||{};
          const calc=calcRental(effectiveContract(c,m),m.prevM,m.prevC,m.currM||0,m.currC||0,m.discount);
          return s + ((m.actualAmount!=null&&m.actualAmount!=='')?+m.actualAmount:calc.total);
        },0);
        return `<div style="margin-bottom:14px">
          <div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface-2);border-radius:6px;margin-bottom:6px">
            <b style="flex:1">${esc(ym)} <span class="muted" style="font-weight:400">· ${ms.length}건 · 합계 ${won(ymTot)}원</span></b>
          </div>
          <div class="tbl-wrap"><table class="tbl compact"><thead><tr>
            <th>청구일</th><th>장비</th><th>모델</th>
            <th class="r">직전 M / C</th><th class="r">현재 M / C</th><th class="r">사용 M / C</th>
            <th class="r">청구액</th><th></th>
          </tr></thead><tbody>
          ${ms.map(m=>{
            const c=RC.find(rc=>rc.id===m.contractId)||{};
            const calc=calcRental(effectiveContract(c,m),m.prevM,m.prevC,m.currM||0,m.currC||0,m.discount);
            const amt=(m.actualAmount!=null&&m.actualAmount!=='')?+m.actualAmount:calc.total;
            return `<tr>
              <td class="muted">${esc(m.closeDate||'')}</td>
              <td>${esc(c.eqNo||'-')}</td>
              <td class="muted">${esc(c.model||'')}</td>
              <td class="r muted num">${fmt(m.prevM||0)} / ${fmt(m.prevC||0)}</td>
              <td class="r num">${fmt(m.currM||0)} / ${fmt(m.currC||0)}</td>
              <td class="r muted num">${fmt(calc.usedM)} / ${fmt(calc.usedC)}</td>
              <td class="r num"><b>${won(amt)}</b></td>
              <td class="r act" style="white-space:nowrap">
                <button class="btn xs" data-rmprint="${esc(ym)}" data-rmprinteq="${esc(m.contractId)}">인쇄</button>
                <button class="btn xs danger" data-rmdel="${m.id}">삭제</button>
              </td>
            </tr>`;
          }).join('')}
          </tbody></table></div>
        </div>`;
      }).join('') : `<p class="hint" style="margin:0;padding:10px 0">선택한 범위에 청구 이력이 없습니다. 범위를 넓히거나 [전체]를 눌러보세요.</p>`):`<p class="hint" style="margin:0">완료된 청구 이력이 없습니다.</p>`}
    </div>`;
  }

  body.innerHTML = `

        <input type="month" id="rentMonth" value="${rentalYM}" style="height:40px;padding:0 12px;border:1px solid var(--border-strong);border-radius:9px;background:var(--surface);font-size:14.5px;color:var(--ink)"></div>
      <div class="fld"><label>마감일 필터 ${rentalDayFilter?`· <b style="color:var(--brand)">${closeDayLabel(rentalDayFilter)}</b> 선택`:'· 누르면 해당 마감일 거래처만 검색 가능'}</label>

          ${dayBtns.map(d=>`<button class="btn xs ${String(d)===rentalDayFilter?'primary':''}" data-day="${d}">${closeDayLabel(d)}</button>`).join('')}
          ${rentalDayFilter?`<button class="btn xs" id="rentDayClear">전체</button>`:''}
        </div></div>
    </div>
    <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:end;margin-top:14px">
      <div class="fld" style="min-width:280px;flex:1"><label>거래처 검색 ${partyQ?`· <b style="color:var(--brand)">${esc(partyQ)}</b> 선택됨`:rentalDayFilter?`· 마감일 ${closeDayLabel(rentalDayFilter)} 거래처 ${activeParties.length}곳`:'· 비우면 활성 장비 전체'}</label>
        <div style="display:flex;gap:8px">
          <input class="input" id="rentPartySearch" placeholder="${activeParties.length?'거래처명 입력 또는 선택':'해당 마감일의 거래처가 없습니다'}" value="${esc(partyQ)}" style="flex:1" ${activeParties.length?'':'disabled'}>
          ${partyQ?`<button class="btn sm" id="rentPartyClear">지우기</button>`:''}
        </div>
      </div>
      <div class="fld" style="max-width:340px"><label>요약</label>
        <div style="font-size:14px;padding:7px 4px;color:var(--ink)">${partyQ?`${esc(partyQ)} 장비`:'장비'} <b>${rows.length}</b>대 · 완료 <b style="color:var(--income)">${completedCnt}</b>건 · 청구합계 <b class="num">${won(totalClaim)}</b></div></div>
    </div>
    ${allActive.length===0?`<div class="hint" style="margin-top:10px;padding:12px;background:var(--surface-2);border-radius:8px">활성 장비가 없습니다. "장비 목록" 탭에서 먼저 임대 계약을 등록하세요.</div>`:''}
  </div>
  ${rows.length?`<div class="card tbl-responsive">
    <div class="tbl-wrap"><table class="tbl compact"><thead><tr>
      <th>거래처/장비</th>
      <th>청구일</th>
      <th class="r">직전 M / C</th>
      <th class="r">현재 M / C</th>
      <th class="r">사용 M / C</th>
      <th class="r">추가료</th>
      <th class="r">자동 합계</th>
      <th class="r">실청구액</th>
      <th>상태</th>
      <th></th>
    </tr></thead><tbody>
    ${rows.map(({c,m,calc})=>{
      const auto=calc.total;
      const status = m.completed?'<span style="color:var(--income);font-weight:700">완료</span>':((m.currM!=null&&m.currM!=='')?'<span style="color:var(--accent);font-weight:600">입력중</span>':'<span class="muted">미입력</span>');

        <td><b>${esc(c.party)}</b>${c.eqNo?` <span class="muted">· 장비${esc(c.eqNo)}</span>`:''}<br><span class="muted" style="font-size:11px">${esc(c.model||'')}</span></td>

          <span class="muted">/</span>
          <input data-k="currC" class="r" inputmode="numeric" value="${m.currC==null||m.currC===''?'':m.currC}" style="width:80px;border:0;border-bottom:1px solid var(--border-strong);padding:3px 2px;text-align:right;font:inherit" ${m.completed?'disabled':''}>
        </td>
        <td class="r muted num">${fmt(calc.usedM)} / ${fmt(calc.usedC)}</td>
        <td class="r muted num">${calc.feeM+calc.feeC?won(calc.feeM+calc.feeC):'-'}</td>
        <td class="r num">${won(auto)}</td>
        <td class="r"><input data-k="actualAmount" class="r" inputmode="numeric" value="${m.actualAmount==null||m.actualAmount===''?'':m.actualAmount}" placeholder="${fmt(auto)}" style="width:100px;border:0;border-bottom:1px solid var(--border-strong);padding:3px 2px;text-align:right;font:inherit" ${m.completed?'disabled':''}></td>

        <td class="r act" style="white-space:nowrap">

            : `<button class="btn xs primary" data-rcomplete="${c.id}">완료</button>`}</td>
      </tr>`;
    }).join('')}

    <div class="hint" style="padding:10px 14px;border-top:1px solid var(--border);font-size:12px">

      · <b>완료</b>를 누르면 해당 거래처의 매출 거래가 자동 등록됩니다(VAT 포함 계약은 부가세 자동 분리, 면세 계약은 VAT 0).<br>
      · 완료 후에도 "완료 취소"로 되돌릴 수 있습니다(연결된 매출 거래도 함께 삭제).
    </div>
  </div>`:(partyQ?`<div class="card panel"><p class="hint" style="margin:0">"${esc(partyQ)}"의 활성 장비가 없습니다.</p></div>`:'')}
  ${historyHtml}`;
  // 이벤트 바인딩
  document.getElementById('rentMonth').onchange=(e)=>{if(e.target.value){rentalYM=e.target.value; drawRentalMonth();}};
  // 거래처 검색 — 한글 입력 중 재렌더로 글자가 사라지는 문제를 막기 위해 'change'에만 반응.
  //  · 자동완성에서 선택 시: 브라우저가 input과 change를 함께 발화 → 정확히 일치하므로 적용
  //  · 직접 타이핑 후 Enter/blur 시: 정확히 일치하면 적용, 아니면 입력값 유지(적용 안 함)
  //  · 전부 지웠을 때: 빈 값으로 필터 해제
  const ps=document.getElementById('rentPartySearch');
  if(ps){
    ps.addEventListener('change',()=>{
      const v=ps.value.trim();
      if(!v){
        if(rentalMonthParty){rentalMonthParty=''; drawRentalMonth();}
        return;
      }
      if(activeParties.includes(v)){
        if(v!==rentalMonthParty){rentalMonthParty=v; drawRentalMonth();}
      }
      // 정확히 일치하지 않으면 무시 — 입력칸 값은 그대로 둔다(사용자가 계속 타이핑하거나 자동완성에서 고를 수 있도록)
    });
    if(activeParties.length) attachDropdown('rentPartySearch', ()=>activeParties);
  }
  const pc=document.getElementById('rentPartyClear');
  if(pc)pc.onclick=()=>{rentalMonthParty=''; drawRentalMonth();};
  // 일자 단축 버튼: 마감일 필터 토글 (해당 마감일 거래처만 검색리스트에)
  document.querySelectorAll('#rentDayBtns [data-day]').forEach(b=>b.onclick=()=>{
    const d=String(b.dataset.day);
    // 같은 버튼 다시 누르면 해제, 다른 버튼이면 그 버튼으로 변경
    rentalDayFilter = (rentalDayFilter===d) ? '' : d;
    // 일자 필터 바뀌면 선택된 거래처가 더이상 매치되지 않을 수 있으니 검사
    if(rentalMonthParty && rentalDayFilter){
      const stillMatches = RC.some(c=>c.party===rentalMonthParty && c.active!==false && String(+c.closeDay||5)===rentalDayFilter);
      if(!stillMatches) rentalMonthParty='';
    }
    drawRentalMonth();
  });
  const dc=document.getElementById('rentDayClear');
  if(dc)dc.onclick=()=>{rentalDayFilter=''; drawRentalMonth();};
  body.querySelectorAll('input[data-k]').forEach(inp=>{
    inp.oninput=(e)=>{
      const tr=e.target.closest('tr');
      const cid=tr.dataset.cid;
      const c=RC.find(x=>x.id===cid);
      const k=e.target.dataset.k;
      let m=RM.find(r=>r.contractId===cid&&r.ym===rentalYM);
      if(!m){
        const prev=prevReading(cid,rentalYM);
        m={id:uid(),contractId:cid,ym:rentalYM,closeDate:rentalDateOf(rentalYM,c),prevM:prev.prevM,prevC:prev.prevC,currM:'',currC:'',discount:0,actualAmount:null,memo:'',completed:false,salesTxId:null};
        RM.push(m);
      }
      if(k==='closeDate') m.closeDate = e.target.value;
      else if(k==='actualAmount') m[k]=e.target.value===''?null:+e.target.value;
      else m[k]=e.target.value===''?'':+e.target.value;
      saveRM();
      const calc=calcRental(effectiveContract(c,m),m.prevM,m.prevC,m.currM||0,m.currC||0,m.discount);
      const cells=tr.children;
      cells[4].textContent=fmt(calc.usedM)+' / '+fmt(calc.usedC);
      cells[5].textContent=(calc.feeM+calc.feeC)?won(calc.feeM+calc.feeC):'-';
      cells[6].textContent=won(calc.total);
      const actInp=tr.querySelector('[data-k="actualAmount"]'); if(actInp)actInp.placeholder=fmt(calc.total);
      const st=cells[8]; if(!m.completed)st.innerHTML=(m.currM!=null&&m.currM!=='')?'<span style="color:var(--accent);font-weight:600">입력중</span>':'<span class="muted">미입력</span>';
    };
    // 카운터 입력 완료(blur) 시 직전보다 작으면 경고 — 계량기 교체 등 실수 방지
    if(inp.dataset.k==='currM'||inp.dataset.k==='currC'){
      inp.onchange=(e)=>{
        const tr=e.target.closest('tr'); const cid=tr.dataset.cid;
        const m=RM.find(r=>r.contractId===cid&&r.ym===rentalYM); if(!m)return;
        const k=e.target.dataset.k;
        const cur=(m[k]==null||m[k]==='')?null:+m[k];
        const prevKey=k==='currM'?'prevM':'prevC';
        const prev=+m[prevKey]||0;
        if(cur!=null && cur<prev){
          const lbl=k==='currM'?'흑백(M)':'컬러(C)';
          alert(`현재 ${lbl} 카운터(${fmt(cur)})가 직전 값(${fmt(prev)})보다 작습니다.\n계량기 교체·오타가 아닌지 확인하세요. (사용량은 0으로 계산됩니다)`);
        }
      };
    }
  });
  body.querySelectorAll('[data-rcomplete]').forEach(b=>b.onclick=()=>completeRental(b.dataset.rcomplete));
  body.querySelectorAll('[data-rcancel]').forEach(b=>b.onclick=()=>cancelRental(b.dataset.rcancel));
  body.querySelectorAll('[data-rmdel]').forEach(b=>b.onclick=()=>deleteRentalMeter(b.dataset.rmdel));
  body.querySelectorAll('[data-rmprint]').forEach(b=>b.onclick=()=>printRentalParty(b.dataset.rmprint, b.dataset.rmprinteq||''));
  // 장비별 필터 버튼
  body.querySelectorAll('[data-histeq]').forEach(b=>b.onclick=()=>{
    histEqFilter = b.dataset.histeq || '';
    renderRental();
  });
  const togInact = document.getElementById('histToggleInactive');
  if(togInact) togInact.onclick = ()=>{
    histShowInactive = !histShowInactive;
    // 숨기기로 전환 시, 해지 장비가 선택돼 있었다면 전체로 리셋
    if(!histShowInactive && histEqFilter){
      const c = RC.find(x=>x.id===histEqFilter);
      if(c && c.active===false) histEqFilter='';
    }
    renderRental();
  };
  // 시작/종료 월 변경 시 목록 즉시 필터링
  const hs = document.getElementById('histStart');
  const he = document.getElementById('histEnd');
  if(hs) hs.onchange = ()=>{
    histRangeStart = hs.value;
    if(he && he.value && hs.value > he.value) histRangeEnd = hs.value; // 시작이 종료보다 늦으면 종료도 맞춤
    renderRental();
  };
  if(he) he.onchange = ()=>{
    histRangeEnd = he.value;
    if(hs && hs.value && he.value < hs.value) histRangeStart = he.value;
    renderRental();
  };
  const resetBtn = document.getElementById('histRangeReset');
  if(resetBtn) resetBtn.onclick = ()=>{ histRangeStart=''; histRangeEnd=''; renderRental(); };
  const rangeBtn = document.getElementById('histRangePrint');
  if(rangeBtn) rangeBtn.onclick = ()=>{
    const start = document.getElementById('histStart').value;
    const end = document.getElementById('histEnd').value;
    if(!start || !end){alert('시작 월과 종료 월을 모두 선택하세요.');return;}
    if(start > end){alert('시작 월이 종료 월보다 늦습니다.');return;}
    printRentalPartyRange(start, end);
  };
}

/* 월 카운터(임대 청구) 영구 삭제 — 완료된 매출도 함께 삭제 */
function deleteRentalMeter(meterId){
  const m=RM.find(r=>r.id===meterId); if(!m)return;
  const c=RC.find(rc=>rc.id===m.contractId)||{};
  const amt=(m.actualAmount!=null&&m.actualAmount!=='')?+m.actualAmount:0;
  const lines=[
    `[${esc(c.party||'(거래처)')}] ${m.ym} 청구 이력을 영구 삭제합니다.`,
    '',
    `· 청구 금액: ${won(amt)}원`,
    m.salesTxId?'· 연결된 매출 거래도 함께 삭제됩니다.':'· (연결된 매출 거래 없음)',
    '',
    '계속할까요?'
  ];
  if(!confirm(lines.join('\n').replace(/<[^>]+>/g,'')))return;
  if(m.salesTxId){
    USER=USER.filter(x=>x.id!==m.salesTxId);
    saveUser(); rebuildT();
  }
  RM=RM.filter(r=>r.id!==meterId);
  saveRM();
  drawRentalMonth();
}

function printRentalParty(ymOverride, eqOverride){
  if(!rentalMonthParty){alert('거래처를 먼저 선택하세요.');return;}
  const ym = ymOverride || rentalYM;
  // 장비 필터: 명시적 인자 우선, 없으면 현재 기청구 이력의 장비 필터(histEqFilter) 적용
  const eqId = (eqOverride!==undefined) ? eqOverride : histEqFilter;
  // 인쇄 대상: 해당 월에 거래처의 활성 장비 + 해당 월 카운터 데이터
  let contracts=RC.filter(c=>c.party===rentalMonthParty && c.active!==false);
  if(eqId) contracts = contracts.filter(c=>c.id===eqId); // 특정 장비만
  if(!contracts.length){alert('해당 거래처의 활성 장비가 없습니다.');return;}
  const rows=contracts.map(c=>{
    const m=RM.find(r=>r.contractId===c.id && r.ym===ym) || {prevM:0,prevC:0,currM:0,currC:0,closeDate:rentalDateOf(ym,c),actualAmount:null,discount:0,completed:false};
    const ec=effectiveContract(c,m);
    const calc=calcRental(ec,m.prevM,m.prevC,m.currM||0,m.currC||0,m.discount);
    const amt=(m.actualAmount!=null&&m.actualAmount!=='')?+m.actualAmount:calc.total;
    return {c,ec,m,calc,amt};
  }).filter(r=>r.amt>0 || r.m.completed);
  if(!rows.length){alert(`${ym} 청구할 임대료가 없습니다.`);return;}
  const tot=rows.reduce((s,r)=>s+r.amt,0);
  const vatIncluded = rows.every(r=>r.ec.vatIncluded);
  const vc = vatIncluded ? vatCalc(tot,'과세포함') : {s:tot,v:0,t:tot};
  const [yy,mm]=ym.split('-');
  const today=todayStr();
  // 수령자(거래처) 정보 — 일괄 인쇄와 동일하게 표시
  const cust = C.find(c=>c.nm===rentalMonthParty) || {};
  const custLine = [
    cust.biz?`등록 ${esc(cust.biz)}`:'',
    cust.ceo?`대표 ${esc(cust.ceo)}`:'',
    cust.tel?esc(cust.tel):''
  ].filter(Boolean).join(' · ');
  const custAddr = cust.addr ? esc(cust.addr) : '';
  const w=window.open('','_blank','width=900,height=700');
  // 장비별 상세 카드(추가단가가 어떻게 적용되었는지 명시)
