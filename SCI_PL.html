function completeRental(cid){
  const c=RC.find(x=>x.id===cid); if(!c)return;
  let m=RM.find(r=>r.contractId===cid&&r.ym===rentalYM);
  if(!m||((m.currM==null||m.currM==='')&&(m.currC==null||m.currC===''))){alert('현재 카운터를 먼저 입력하세요.');return;}
  const calc=calcRental(c,m.prevM,m.prevC,m.currM||0,m.currC||0,m.discount);
  const amt=(m.actualAmount!=null&&m.actualAmount!=='')?+m.actualAmount:calc.total;
  if(!amt){alert('청구액이 0원입니다.');return;}
  if(!confirm(`${c.party}${c.eqNo?'(장비'+c.eqNo+')':''} · ${rentalYM} 임대료 ${fmt(amt)}원을 매출로 등록할까요?`))return;
  // 매출 거래 생성
  const mode = c.vatIncluded?'과세포함':'면세';
  const batch='rental_'+m.id;
  const dd=(m.closeDate||rentalDateOf(rentalYM,c));
  const noteVat=c.vatIncluded?'':'면세(세금계산서 미발행)';
  const extraTotal=Math.round((calc.feeM||0)+(calc.feeC||0));   // 추가 사용료 합계
  const baseTotal=amt-extraTotal;                                // 기본 임대료(할인·실청구 조정 반영)
  const model=(c.model||'').trim();                              // 규격/옵션에 표시할 장비모델
  const rows=[];
  if(extraTotal>0 && baseTotal>0){
    // 추가 사용료가 있으면 → 기본 임대료 / 추가 사용료 두 줄로 나눠 등록
    const usage=[];
    if(calc.extraM>0) usage.push(`흑백 ${fmt(calc.extraM)}장`);
    if(calc.extraC>0) usage.push(`컬러 ${fmt(calc.extraC)}장`);
    const vcB=vatCalc(baseTotal,mode), vcE=vatCalc(extraTotal,mode);
    rows.push({id:uid(), batch, d:dd, g:'수입', p:c.party, a:'매출',
      m:rentalLabel(c,rentalYM), ic:'', inm:rentalLabel(c,rentalYM), spec:model, u:'월', q:1, pr:baseTotal,
      s:vcB.s, v:vcB.v, t:vcB.t, pm:'', tax:'', note:noteVat, _u:1, _rental:1, _rentalMeterId:m.id});
    rows.push({id:uid(), batch, d:dd, g:'수입', p:c.party, a:'매출',
      m:'추가 사용료 '+rentalYM, ic:'', inm:usage.length?`추가 사용료 (${usage.join(' · ')})`:'추가 사용료', spec:model, u:'월', q:1, pr:extraTotal,
      s:vcE.s, v:vcE.v, t:vcE.t, pm:'', tax:'', note:noteVat, _u:1, _rental:1, _rentalMeterId:m.id});
  } else {
    const vc = vatCalc(amt, mode);
    rows.push({id:uid(), batch, d:dd, g:'수입', p:c.party, a:'매출',
      m:rentalLabel(c,rentalYM), ic:'', inm:rentalLabel(c,rentalYM), spec:model, u:'월', q:1, pr:amt,
      s:vc.s, v:vc.v, t:vc.t, pm:'', tax:'', note:noteVat, _u:1, _rental:1, _rentalMeterId:m.id});
  }
  USER.push(...rows); saveUser(); rebuildT();
  // 완료 시점에 단가 스냅샷·실청구액을 박아둠 → 이후 계약 단가가 바뀌어도 이 청구는 영향받지 않음
  m.completed=true;
  m.salesTxId=rows[0].id;
  m.salesBatch=batch;      // 취소 시 배치 전체(기본+추가) 삭제용
  m.actualAmount=amt;
  m.priceSnap={
    basePrice:+c.basePrice||0,
    contractM:+c.contractM||0,
    contractC:+c.contractC||0,
    extraM:+c.extraM||0,
    extraC:+c.extraC||0,
    vatIncluded:c.vatIncluded!==false
  };
  saveRM();
  drawRentalMonth();
}

function cancelRental(cid){
  const m=RM.find(r=>r.contractId===cid&&r.ym===rentalYM); if(!m||!m.completed)return;
  if(!confirm('완료를 취소할까요? 연결된 매출 거래도 함께 삭제됩니다.'))return;
  const b=m.salesBatch||('rental_'+m.id);
  USER=USER.filter(x=>x.batch!==b && x.id!==m.salesTxId); saveUser(); rebuildT();
  // 완료 취소 시 스냅샷도 제거 → 재완료할 땐 현재 단가로 계산됨
  m.completed=false; m.salesTxId=null; m.salesBatch=null; m.priceSnap=null;
  saveRM();
  drawRentalMonth();
}

// 계약서 입력값 → 새 장비 등록 (장비 여러 대면 각각)
function contractToEquipment(f){
  if(!f.party){alert('거래처를 입력하세요.');return;}
  const devs=(f.devices||[]).filter(d=>d.model||d.basePrice||d.contractM||d.contractC);
  if(!devs.length){alert('장비 정보를 1개 이상 입력하세요.');return;}
  const memo=(f.special||[]).filter(Boolean).map((s,i)=>`${i+1}. ${s}`).join(' / ');
  if(!confirm(`"${f.party}" 거래처의 장비 ${devs.length}대를 임대 현황에 등록할까요?`)) return;
  // 계약 종료일 자동 계산
  let cEnd='';
  if(f.contractDate && +f.contractMonths>0){
    const d=new Date(f.contractDate); d.setMonth(d.getMonth()+(+f.contractMonths)); d.setDate(d.getDate()-1);
    cEnd=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  devs.forEach(dev=>{
    RC.push({
      id:uid(), party:f.party, eqNo:'', model:dev.model||'', serial:'',
      installDate:f.contractDate||todayStr(), closeDay:5,
      basePrice:+dev.basePrice||0, contractM:+dev.contractM||0, contractC:+dev.contractC||0,
      extraM:+dev.extraM||0, extraC:+dev.extraC||0, vatIncluded:true,
      initialM:0, initialC:0, active:true, memo:memo,
      contractStart:f.contractDate||'', contractMonths:+f.contractMonths||'', contractEnd:cEnd,
      installAddr:f.installAddr||''
    });
  });
  saveRC();
  if(confirm(`장비 ${devs.length}대가 등록되었습니다. 임대 현황 → 장비 목록으로 이동할까요?`)){
    rentalTab='list'; rentalEdit=null; go('rental');
  }
}

/* ============================================================
   A/S 스케줄 — 간단한 한 줄 등록 / 완료 처리
   ============================================================ */
let asFilter = 'all'; // 'pending' | 'done' | 'all' — 초기 진입 시 전체 조회
let asEditId=null; // A/S 인라인 수정 중인 항목 id
function renderAS(){
  const today=todayStr();
  const filtered = AS.filter(a=>{
    if(asFilter==='pending') return !a.done;
    if(asFilter==='done') return !!a.done;
    return true;
  }).sort((a,b)=>{
    // 미완료: 일자 오름차순(가까운 일정 위에), 완료: 완료일 내림차순
    if(!a.done && !b.done) return (a.d||'').localeCompare(b.d||'');
    if(a.done && b.done) return (b.doneAt||'').localeCompare(a.doneAt||'');
    return a.done?1:-1;
  });
  const pendCnt = AS.filter(a=>!a.done).length;
  const doneCnt = AS.filter(a=>a.done).length;
  content.innerHTML=`
   <div class="card panel" style="margin-bottom:18px;max-width:800px">
     <div class="panel-head"><h3>${esc(LBL.title_as)}</h3>
       <div style="display:flex;gap:6px">
         <button class="btn xs ${asFilter==='pending'?'primary':''}" data-asf="pending">예정 ${pendCnt}</button>
         <button class="btn xs ${asFilter==='done'?'primary':''}" data-asf="done">완료 ${doneCnt}</button>
         <button class="btn xs ${asFilter==='all'?'primary':''}" data-asf="all">전체 ${AS.length}</button>
       </div>
     </div>
     <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;padding:14px 0 8px;border-bottom:1px solid var(--border)">
       <div class="fld" style="flex:0 0 130px"><label>일자</label><input type="date" id="asD" value="${today}"></div>
       <div class="fld" style="flex:1 1 180px"><label>거래처</label><input id="asP" placeholder="거래처명(선택)"></div>
       <div class="fld" style="flex:2 1 260px"><label>내용</label><input id="asM" placeholder="예: 토너 교체, 컬러 출력 안됨 등"></div>
       <button class="btn primary" id="asAdd">등록</button>
     </div>
   </div>
   <div id="asList" style="max-width:800px"></div>`;
  drawASList(filtered);
  content.querySelectorAll('[data-asf]').forEach(b=>b.onclick=()=>{asFilter=b.dataset.asf; renderAS();});
  document.getElementById('asAdd').onclick=addASItem;
  attachDropdown('asP', partyNames);
  document.getElementById('asM').addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault(); addASItem();}
  });
}
function addASItem(){
  const d=document.getElementById('asD').value;
  const p=document.getElementById('asP').value.trim();
  const m=document.getElementById('asM').value.trim();
  if(!m){alert('내용을 입력하세요.');document.getElementById('asM').focus();return;}
  AS.push({id:uid(),d:d||todayStr(),p,m,done:false,createdAt:Date.now()});
  saveAS();
  renderAS();
}

      <th style="width:32px"></th>
      <th style="width:100px">일자</th>

    <div class="tcards">
    ${rows.map(a=>{
      const overdue = !a.done && a.d && a.d<today;
      const dueToday = !a.done && a.d===today;

        return `<div class="tcard" style="border-color:var(--brand)">

            <div class="fld"><label>일자</label><input type="date" data-ek="d" value="${esc(a.d||'')}"></div>

            <div class="fld"><label>내용</label><input data-ek="m" value="${esc(a.m||'')}" placeholder="내용"></div>

              <button class="btn sm primary" data-assave="${a.id}" style="flex:1">저장</button>

        </div>
        <div style="margin:6px 0 10px;${a.done?'text-decoration:line-through;color:var(--ink-faint)':''}">${esc(a.m)||'<span class="muted">-</span>'}</div>
        <div style="display:flex;gap:8px;align-items:center">
          <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;flex:1">
            <input type="checkbox" data-astoggle="${a.id}" ${a.done?'checked':''} style="width:18px;height:18px;cursor:pointer">
            ${a.done?'완료 취소':'완료 처리'}
          </label>
          <button class="btn xs" data-asedit="${a.id}">수정</button>
          <button class="btn xs danger" data-asdel="${a.id}">삭제</button>
        </div>
      </div>`;
    }).join('')}
    </div></div>`;
  el.querySelectorAll('[data-astoggle]').forEach(c=>c.onchange=e=>toggleAS(e.target.dataset.astoggle));
  el.querySelectorAll('[data-asdel]').forEach(b=>b.onclick=()=>deleteAS(b.dataset.asdel));
  el.querySelectorAll('[data-asedit]').forEach(b=>b.onclick=()=>{asEditId=b.dataset.asedit; renderAS();});
  el.querySelectorAll('[data-ascancel]').forEach(b=>b.onclick=()=>{asEditId=null; renderAS();});
  el.querySelectorAll('[data-assave]').forEach(b=>b.onclick=()=>saveASEdit(b.dataset.assave, b));
}
function saveASEdit(id, btn){
  const a=AS.find(x=>x.id===id); if(!a)return;
  // 같은 행/카드 내 입력값 수집
  const scope = btn.closest('tr') || btn.closest('.tcard') || document;
  const get=k=>{const el=scope.querySelector(`[data-ek="${k}"]`); return el?el.value:'';};
  const d=get('d'), p=(get('p')||'').trim(), m=(get('m')||'').trim();
  if(!m){alert('내용을 입력하세요.');return;}
  a.d=d||todayStr(); a.p=p; a.m=m;
  saveAS();
  asEditId=null;
  renderAS();
}
function toggleAS(id){
  const a=AS.find(x=>x.id===id); if(!a)return;
  a.done=!a.done;
  a.doneAt=a.done?todayStr():null;
  saveAS();
  renderAS();
}
function deleteAS(id){
  const a=AS.find(x=>x.id===id); if(!a)return;
  if(!confirm(`삭제할까요?\n· ${a.d} / ${a.p||'(거래처 없음)'} / ${a.m}`))return;
  AS=AS.filter(x=>x.id!==id);
  saveAS();
  renderAS();
}

  });
  // 작성일 변경: 거래처가 있으면 그 일자 매출로 다시 불러오기
  document.getElementById('sDate').addEventListener('change',()=>{
    stInfo.date=document.getElementById('sDate').value;
    if(stInfo.to) pullStatement(true);
    else drawSDoc();
  });
  // 세금계산서 발행 토글
  document.getElementById('sTax').onchange=()=>{stInfo.taxIssue=document.getElementById('sTax').value;drawSDoc();};
  document.getElementById('sMemo').oninput=()=>{stInfo.memo=document.getElementById('sMemo').value;drawSDoc();};
  document.getElementById('sPrint').onclick=printDoc;
}
function pullStatement(quiet){
  const to=document.getElementById('sTo').value.trim();
  const date=document.getElementById('sDate').value;
  if(!to){if(!quiet)alert('먼저 거래처를 선택하세요.');return;}
  if(!date){if(!quiet)alert('작성일을 선택하세요.');return;}
  // 작성일과 같은 날짜의 매출만 불러오기
  const rows=T.filter(t=>t.p===to&&t.g==='수입'&&t.d===date).sort((a,b)=>(a.d||'').localeCompare(b.d||''));
  if(!rows.length){
    // 자동 모드일 땐 안내 없이 빈 라인으로 두기, 수동 모드일 땐 알림
    if(!quiet) alert(`${date}에 해당 거래처의 매출 거래가 없습니다.`);
    stLines=[{md:'',nm:'',spec:'',unit:'ea',q:1,pr:0}];
    drawSLines(); drawSDoc();
    return;
  }
  stLines=rows.map(r=>({md:(r.d||'').slice(5).replace('-','/'),nm:r.inm||r.m||r.a,spec:r.spec||'',unit:r.u||'ea',q:r.q||1,pr:r.pr||r.t,_fixedS:r.s,_fixedV:r.v,_fixedT:r.t}));
  // 매출 입력 시 적은 메모를 자동으로 가져오기 (중복 제거 후 합침)
  const notes=[...new Set(rows.map(r=>(r.note||'').trim()).filter(Boolean))];
  stInfo.memo = notes.join(' / ');
  const mEl=document.getElementById('sMemo'); if(mEl) mEl.value=stInfo.memo;
  drawSLines();drawSDoc();
}
function drawSLines(){
  const tb=document.getElementById('sBody');
  tb.innerHTML=stLines.map((l,i)=>{const vc=l._fixedS!=null?{s:l._fixedS}:vatCalc((l.q||0)*(l.pr||0),'과세포함');
    return `<tr data-i="${i}">
      <td><input data-k="md" value="${esc(l.md)}" placeholder="03/15"></td>
      <td><input data-k="nm" value="${esc(l.nm)}"></td>
      <td><input data-k="spec" value="${esc(l.spec)}"></td>
      <td><input data-k="unit" value="${esc(l.unit)}"></td>
      <td><input data-k="q" class="r" inputmode="numeric" value="${l.q}"></td>
      <td><input data-k="pr" class="r" inputmode="numeric" value="${l.pr}"></td>
      <td class="calc">${fmt(vc.s)}</td>
      <td>${stLines.length>1?`<button class="li-del" data-del="${i}">×</button>`:''}</td></tr>`;}).join('');
  tb.querySelectorAll('input').forEach(inp=>inp.oninput=e=>{const i=+e.target.closest('tr').dataset.i;const k=e.target.dataset.k;
    stLines[i][k]=(k==='q'||k==='pr')?numv(e.target):e.target.value;
    if(k==='q'||k==='pr'){delete stLines[i]._fixedS;delete stLines[i]._fixedV;delete stLines[i]._fixedT;}
    drawSDoc();const c=tb.querySelector(`tr[data-i="${i}"] .calc`);if(c)c.textContent=fmt(vatCalc((stLines[i].q||0)*(stLines[i].pr||0),'과세포함').s);});
  tb.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{stLines.splice(+b.dataset.del,1);drawSLines();drawSDoc();});
  tb.querySelectorAll('input[data-k="nm"]').forEach((inp,i)=>{ if(!inp.id)inp.id='sNm_'+i; attachDropdown(inp.id, ddItemNames); });
}
function curAR(name){const p=byParty().find(x=>x.party===name);return p?Math.max(0,p.ar):0;}
function supBlock(tagL,nm,reg,ceo,addr,biz,tel,email,seal){
  return `<div class="dbox2" style="position:relative">
    ${seal?sealImg('','stmt'):''}
    <div class="ptag">[${esc(tagL)}]</div><div class="pname">${esc(nm||'')}</div>
    <table>
      <tr><td class="rk">등록번호</td><td>${esc(reg||'')}${ceo?` <span style="color:#bbb">|</span> ${esc(ceo)}`:''}</td></tr>
      <tr><td class="rk">사업장</td><td>${addrHtml(addr)}</td></tr>
      <tr><td class="rk">업태/종목</td><td>${esc(biz||'')}</td></tr>
      <tr><td class="rk">전화번호</td><td>${esc(tel||'')}</td></tr>
      <tr><td class="rk">이메일</td><td>${esc(email||'')}</td></tr>
    </table></div>`;
}
function amtBlock(t,s,v){
  return `<div class="dbox2">
    <div class="lrow" style="border:0;padding:2px"><span class="lk" style="flex:0 0 64px;color:#888">합계금액</span></div>
    <table>
      <tr><td class="rk">합계금액</td><td class="big">${fmt(t)} 원</td></tr>
      <tr><td class="rk">공급가액</td><td>${fmt(s)}</td></tr>
      <tr><td class="rk">VAT(세액)</td><td>${fmt(v)}</td></tr>
    </table></div>`;
}
function stmtCopy(copyLabel, leftIsRecv){
  // leftIsRecv: true → 공급받는자 보관용(받는자 왼쪽), false → 공급자 보관용(공급자 왼쪽)
  let s=0,v=0,t=0; const rows=stLines.filter(l=>l.nm||l.pr);
  const ROWS=8; // 품목 행 고정(빈칸 포함 총 8행)
  const body=rows.slice(0,ROWS).map(l=>{const vc=l._fixedS!=null?{s:l._fixedS,v:l._fixedV,t:l._fixedT}:vatCalc((l.q||0)*(l.pr||0),'과세포함');
    s+=vc.s;v+=vc.v;t+=vc.t;
    return `<tr><td class="c">${esc(l.md||'')}</td><td>${esc(l.nm)}</td><td class="c">${esc(l.spec||'-')}</td>
      <td class="c">${esc(l.unit||'')}</td><td class="r">${fmt(l.q)}</td><td class="r">${fmt(l.pr)}</td>
      <td class="r">${fmt(vc.s)}</td><td class="r">${fmt(vc.v)}</td></tr>`;}).join('');
  // 7행을 초과하는 품목은 합계에 누락되지 않도록 별도 합산
  rows.slice(ROWS).forEach(l=>{const vc=l._fixedS!=null?{s:l._fixedS,v:l._fixedV,t:l._fixedT}:vatCalc((l.q||0)*(l.pr||0),'과세포함');s+=vc.s;v+=vc.v;t+=vc.t;});
  const blanks=Math.max(0, ROWS-Math.min(rows.length,ROWS));let pad='';for(let i=0;i<blanks;i++)pad+=`<tr><td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`;
  const moreNote = rows.length>ROWS ? `<tr><td colspan="8" class="c" style="font-size:10px;color:#a23535">외 ${rows.length-ROWS}개 품목 합산 포함</td></tr>` : '';
  const ar=stInfo.to?curAR(stInfo.to):0;
  const ci=custInfo(stInfo.to);
  const sup=supBlock('공급자',ISSUER.name,ISSUER.reg,ISSUER.ceo,ISSUER.addr,ISSUER.biz,ISSUER.tel,ISSUER.email,true);
  const recv=supBlock('공급받는자',ci.nm,ci.biz,ci.ceo,ci.addr,[ci.cat,ci.item].filter(Boolean).join('/'),ci.tel,ci.email,false);
  const d=new Date(stInfo.date); const wd=['일','월','화','수','목','금','토'][isNaN(d)?0:d.getDay()];
  const dateK=isNaN(d)?esc(stInfo.date):`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${wd}요일`;
  const left  = leftIsRecv ? recv : sup;
  const right = leftIsRecv ? sup  : recv;
  return `<div class="doc red stmt-half">
     <div class="dhead">
       <div class="dtitle">거래명세서<small class="g">(${esc(copyLabel)})</small></div>
       <div class="ddate">${dateK}</div>
     </div>
     <div class="dtop2">${left}${right}</div>
     <div class="drow" style="border-top:0">
       <div class="dcell" style="flex:1"><span class="fk">합계금액</span><span style="font-weight:800;font-size:15px">${fmt(t)} 원</span></div>
       <div class="dcell" style="flex:1"><span class="fk">공급가액</span><span>${fmt(s)}</span><span class="fk" style="margin-left:14px">VAT</span><span>${fmt(v)}</span></div>
     </div>
     <table class="items"><thead><tr>
       <th style="width:8%">월일</th><th style="width:22%">품명</th><th>규격/옵션</th><th style="width:7%">단위</th><th style="width:7%">수량</th><th style="width:12%">단가</th><th style="width:14%">공급가액</th><th style="width:12%">VAT</th>
     </tr></thead><tbody>${body}${pad}${moreNote}</tbody>
     <tbody><tr class="sum"><td colspan="6" class="r">합계</td><td class="r">${fmt(s)}</td><td class="r">${fmt(v)}</td></tr></tbody>
     </table>
     <div class="drow" style="border-top:0"><div class="dcell" style="flex:1"><span class="fk">비고</span><span style="white-space:pre-wrap">${esc(stInfo.memo||'')}</span></div></div>
     <div class="drow">
       <div class="dcell" style="flex:0 0 auto"><span class="fk">총 미수금</span><span class="ar">${fmt(ar)} 원</span></div>
       <div class="dcell" style="flex:0 0 auto"><span class="fk">세금계산서</span><span>${stInfo.taxIssue?'발행':'미발행'}</span></div>
       <div class="dcell" style="flex:1"><span class="fk">결제정보</span><span>${esc(ISSUER.bank)}</span></div>
       <div class="dcell" style="flex:0 0 auto;justify-content:flex-end"><span class="fk">인수자/확인</span><span style="min-width:64px;text-align:right">(인)</span></div>
     </div>
   </div>`;
}
function drawSDoc(){
  document.getElementById('sDoc').innerHTML=
    `<div class="stmt-paper"><div class="stmt-sheet">`+
    `<div class="stmt-half-wrap">`+ stmtCopy('공급자 보관용', false) +`</div>`+
    `<div class="stmt-half-wrap">`+ stmtCopy('공급받는자 보관용', true) +`</div>`+
    `</div></div>`;
  bindSealDrag();
  fitStmtPreview();
  requestAnimationFrame(fitStmtPreview);
}
// 미리보기(210×297mm A4)를 화면 폭에 맞춰 균등 축소 — 인쇄 결과와 동일 비율 유지
function fitStmtPreview(){
  const sDoc=document.getElementById('sDoc'); if(!sDoc)return;
  const paper=sDoc.querySelector('.stmt-paper'), sheet=sDoc.querySelector('.stmt-sheet');
  if(!paper||!sheet)return;
  const SW=794, SH=1123;                 // 210mm×297mm @96dpi
  const avail=sDoc.clientWidth||SW;
  const k=Math.min(1,(avail-2)/SW);
  sheet.style.transform='scale('+k+')';
  sheet.style.transformOrigin='top left';
  paper.style.width=(SW*k)+'px';
  paper.style.height=(SH*k)+'px';
}
window.addEventListener('resize',()=>{clearTimeout(window._fitStmtT);window._fitStmtT=setTimeout(fitStmtPreview,150);});

/* ============================================================
   변경 사항 누적 알림 — 마지막 백업 이후 N건 변경되면 상단 띠 표시
   ============================================================ */
const LS_BKP='sci_backup_state_v1';
const LS_BKPALERT='sci_backup_alert_v1'; // 백업 알림 ON/OFF (기본 ON)
const BKP_THRESHOLD=10;  // 이 건수 이상 쌓이면 알림
const BKP_HOURS=24;       // 또는 이 시간이 지나면 알림
function backupAlertOn(){ try{const v=localStorage.getItem(LS_BKPALERT); return v===null?true:JSON.parse(v);}catch(e){return true;} }
function setBackupAlert(on){ try{localStorage.setItem(LS_BKPALERT,JSON.stringify(!!on));}catch(e){} showBackupBannerIfNeeded(); }
function getBackupState(){
  try{const s=localStorage.getItem(LS_BKP); if(s)return JSON.parse(s);}catch(e){}
  return {lastBackupAt:null, changesSince:0};
}
function setBackupState(st){try{localStorage.setItem(LS_BKP,JSON.stringify(st));}catch(e){}}
function markChange(){
  const st=getBackupState();
  st.changesSince=(st.changesSince||0)+1;
  setBackupState(st);
  showBackupBannerIfNeeded();
}
function markBackupDone(){
  setBackupState({lastBackupAt:Date.now(), changesSince:0});
  showBackupBannerIfNeeded();
}
function showBackupBannerIfNeeded(){
  const banner=document.getElementById('backupBanner');
  if(!banner)return;
  // 알림 OFF면 항상 숨김
  if(!backupAlertOn()){ banner.style.display='none'; banner.innerHTML=''; return; }
  const st=getBackupState();
  // 잠시 무시(나중에) 중이면 표시 안 함
  if(st._snoozedUntil && Date.now()<st._snoozedUntil){
    banner.style.display='none';banner.innerHTML='';return;
  }
  const elapsed=st.lastBackupAt?(Date.now()-st.lastBackupAt)/3600000:Infinity;
  const need = (st.changesSince>=BKP_THRESHOLD) || (st.changesSince>0 && elapsed>=BKP_HOURS);
  if(!need){banner.style.display='none';banner.innerHTML='';return;}
  const last = st.lastBackupAt ? new Date(st.lastBackupAt).toLocaleString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '(없음)';
  banner.style.display='flex';
  banner.innerHTML=`
    <span style="flex:1">⚠ <b>마지막 백업 이후 ${st.changesSince}건의 변경</b>이 있었습니다. 백업해두시면 안전합니다. <span style="color:var(--ink-faint);font-size:11.5px;margin-left:6px">최근 백업: ${last}</span></span>
    <button class="btn xs primary" id="bkpNow">💾 지금 백업</button>
    <button class="btn xs" id="bkpLater">나중에</button>`;
  document.getElementById('bkpNow').onclick=()=>{exportAll(); markBackupDone();};
  document.getElementById('bkpLater').onclick=()=>{
    // 한 시간 후에 다시 알림 — 잠시 무시
    const st2=getBackupState();
    st2._snoozedUntil=Date.now()+3600000;
    setBackupState(st2);
    banner.style.display='none';
  };
}
// 초기 진입 시 1회 알림 확인
